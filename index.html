<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radar Seguro RJ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style> 
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
    }

    /* Container do Mapa */
    #map-viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 800px;
    }

    #map {
      width: 100vw;
      height: 100vh;
      transform-origin: center bottom;
      transition: transform 0.4s ease-out;
    }

    /* Modo 3D Perspectiva Suave */
    .modo-3d #map {
      transform: rotateX(40deg) scale(1.15);
    }

    /* Header Superior */
    .top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13, 23, 42, 0.95);
      border: 1px solid #1e293b;
      padding: 8px 12px;
      border-radius: 12px;
      color: #fff;
    }

    .title-app {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-tags {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tag-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: #334155;
      color: #fff;
    }

    .tag-badge.anp { background: #eab308; color: #000; }
    .tag-badge.alerta { background: #0284c7; }
    .tag-badge.gps { background: #16a34a; }
    .tag-badge.gps.off { background: #64748b; }

    /* Barra de Busca */
    .search-box {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      position: relative;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-box button {
      background: #0284c7;
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 0 16px;
      cursor: pointer;
      min-width: 64px;
    }

    .search-box button:disabled {
      background: #334155;
      cursor: wait;
    }

    /* Lista de sugestões do geocoding */
    .suggest-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      z-index: 2000;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .suggest-item {
      padding: 10px 12px;
      font-size: 13px;
      color: #e2e8f0;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
    }

    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:active { background: #1e293b; }

    /* Barra de Filtros (Apenas Todos, Problemas e GNV) */
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    .filter-btn.danger.active {
      background: #ef4444;
      border-color: #f87171;
    }

    .filter-btn.success.active {
      background: #10b981;
      border-color: #34d399;
    }

    /* Painel Flutuante Lateral */
    .side-controls {
      position: absolute;
      right: 12px;
      top: 150px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .side-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Painel Inferior de Rota */
    .bottom-panel {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
    }

    .bottom-panel.visible { display: block; }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .destination-name {
      font-size: 15px;
      font-weight: 700;
    }

    .btn-cancel {
      background: #ef4444;
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .route-metrics {
      display: flex;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .metric-time {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
    }

    .metric-dist {
      font-size: 13px;
      color: #94a3b8;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      padding: 10px;
      border-radius: 8px;
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .btn-nav-app {
      grid-column: span 2;
      background: #0284c7;
      margin-bottom: 4px;
    }

    .btn-gmaps { background: #16a34a; }
    .btn-waze { background: #0284c7; }

    /* Marcador do Carro */
    .car-marker {
      transition: transform 0.2s linear;
    }

    /* Toast de erro/aviso */
    .toast {
      position: absolute;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      border: 1px solid #ef4444;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 3000;
      max-width: 90vw;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="top-bar">
    <div class="header-info">
      <div class="title-app">⛽ RADAR SEGURO RJ PRO</div>
      <div class="status-tags">
        <span class="tag-badge anp">ANP</span>
        <span class="tag-badge alerta">Alerta: ON</span>
        <span class="tag-badge gps off" id="gps-badge">GPS...</span>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="dest-input" placeholder="Digite o destino..." value="Caminho de Tutóia 520, Rio de Janeiro" autocomplete="off" />
      <button id="btn-ir" onclick="iniciarRota()">🔍 IR</button>
      <div class="suggest-list" id="suggest-list"></div>
    </div>

    <div class="filter-bar">
      <button id="btn-filter-todos" class="filter-btn active" onclick="filtrarPostos('todos')">⛽ Todos</button>
      <button id="btn-filter-problemas" class="filter-btn danger" onclick="filtrarPostos('problemas')">⛔ Postos com Problemas</button>
      <button id="btn-filter-gnv" class="filter-btn success" onclick="filtrarPostos('gnv')">🟢 GNV</button>
    </div>
  </div>

  <!-- Botões Flutuantes Laterais -->
  <div class="side-controls">
    <button class="side-btn" onclick="centralizarUsuario()">🎯</button>
    <button class="side-btn" onclick="map.zoomIn()">➕</button>
    <button class="side-btn" onclick="map.zoomOut()">➖</button>
  </div>

  <!-- Viewport e Mapa -->
  <div id="map-viewport">
    <div id="map"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Painel Inferior -->
  <div class="bottom-panel" id="bottom-panel">
    <div class="route-header">
      <div class="destination-name" id="dest-label">Destino</div>
      <button class="btn-cancel" onclick="cancelarNavegacao()">✖ Cancelar</button>
    </div>
    <div class="route-metrics">
      <div class="metric-time" id="route-time">-- min</div>
      <div class="metric-dist" id="route-dist">-- km</div>
    </div>
    <div class="action-grid">
      <button class="btn-action btn-nav-app" id="btn-nav-3d" onclick="iniciarNavegacaoInterna()">🚀 NAVEGAR EM 3D</button>
      <button class="btn-action btn-gmaps" onclick="abrirGoogleMaps()">Google Maps</button>
      <button class="btn-action btn-waze" onclick="abrirWaze()">Waze</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- 1. CONFIGURAÇÃO BASE DO MAPA ---
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([-22.8950, -43.6150], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    let userPos = [-22.8950, -43.6150];
    let destPos = null;
    let rotaLayer = null;
    let postosMarkers = [];
    let carMarker = null;
    let wakeLock = null;
    let gpsAtivo = false;

    // --- 2. BASE DE DADOS DOS POSTOS DO RJ ---
    const postosRJ = [
      { id: 1, nome: "Posto Shell Cosmos", lat: -22.8965, lng: -43.6120, gnv: true, irregular: false },
      { id: 2, nome: "Posto Ipiranga Paciência", lat: -22.8920, lng: -43.6190, gnv: true, irregular: false },
      { id: 3, nome: "Posto BR Cesário de Melo", lat: -22.8980, lng: -43.6100, gnv: false, irregular: true },
      { id: 4, nome: "Posto GNV Santa Margarida", lat: -22.8910, lng: -43.6090, gnv: true, irregular: false },
      { id: 5, nome: "Auto Posto Estrada do Sítio", lat: -22.8940, lng: -43.6160, gnv: false, irregular: false }
    ];

    // Ícone do Veículo
    const carIcon = L.divIcon({
      className: 'car-marker',
      html: '<div style="font-size: 26px; transform: translate(-50%, -50%);">🚗</div>',
      iconSize: [30, 30]
    });

    carMarker = L.marker(userPos, { icon: carIcon }).addTo(map);

    // --- TOAST DE FEEDBACK ---
    let toastTimeout = null;
    function mostrarToast(msg, duracao = 3200) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('visible'), duracao);
    }

    // --- 3. WAKE LOCK API (TELA SEMPRE ATIVA) ---
    async function ativarTelaSempreAtiva() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock não suportado ou negado:', err);
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await ativarTelaSempreAtiva();
      }
    });

    // --- 4. FILTROS DE POSTOS ---
    function carregarPostos(lista) {
      postosMarkers.forEach(m => map.removeLayer(m));
      postosMarkers = [];

      lista.forEach(posto => {
        const cor = posto.irregular ? '#ef4444' : (posto.gnv ? '#10b981' : '#38bdf8');
        const iconHtml = `
          <div style="background:${cor}; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 2px 5px rgba(0,0,0,0.4); font-size:12px;">
            ${posto.irregular ? '⛔' : (posto.gnv ? '🟢' : '⛽')}
          </div>
        `;

        const marker = L.marker([posto.lat, posto.lng], {
          icon: L.divIcon({ className: 'p-pin', html: iconHtml, iconSize: [24, 24] })
        }).bindPopup(`<b>${posto.nome}</b><br>GNV: ${posto.gnv ? 'Sim' : 'Não'}<br>Status: ${posto.irregular ? 'Irregular (ANP)' : 'Regular'}`);

        marker.addTo(map);
        postosMarkers.push(marker);
      });
    }

    function filtrarPostos(tipo) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

      if (tipo === 'gnv') {
        document.getElementById('btn-filter-gnv').classList.add('active');
        carregarPostos(postosRJ.filter(p => p.gnv));
      } else if (tipo === 'problemas') {
        document.getElementById('btn-filter-problemas').classList.add('active');
        carregarPostos(postosRJ.filter(p => p.irregular));
      } else {
        document.getElementById('btn-filter-todos').classList.add('active');
        carregarPostos(postosRJ);
      }
    }

    // --- 5. GEOCODING (endereço -> coordenadas) via Nominatim/OSM ---
    let geocodeAbortCtrl = null;

    async function geocodeEndereco(texto) {
      // Restringe a busca à área do Rio de Janeiro para melhorar a relevância
      const viewbox = '-43.85,-22.75,-43.10,-23.10';
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=br` +
                  `&viewbox=${viewbox}&bounded=0&q=${encodeURIComponent(texto)}`;

      const resp = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
      if (!resp.ok) throw new Error('Falha na consulta de geocoding');
      return resp.json();
    }

    // Autocomplete simples enquanto o usuário digita
    const destInput = document.getElementById('dest-input');
    const suggestList = document.getElementById('suggest-list');
    let debounceTimer = null;

    destInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const valor = destInput.value.trim();
      if (valor.length < 4) {
        suggestList.style.display = 'none';
        return;
      }
      debounceTimer = setTimeout(async () => {
        try {
          const resultados = await geocodeEndereco(valor);
          renderSugestoes(resultados);
        } catch (e) {
          console.warn('Erro no autocomplete:', e);
        }
      }, 600);
    });

    function renderSugestoes(resultados) {
      if (!resultados || resultados.length === 0) {
        suggestList.style.display = 'none';
        return;
      }
      suggestList.innerHTML = '';
      resultados.forEach(r => {
        const div = document.createElement('div');
        div.className = 'suggest-item';
        div.textContent = r.display_name;
        div.onclick = () => {
          destInput.value = r.display_name;
          destPos = [parseFloat(r.lat), parseFloat(r.lon)];
          suggestList.style.display = 'none';
        };
        suggestList.appendChild(div);
      });
      suggestList.style.display = 'block';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) suggestList.style.display = 'none';
    });

    // --- 6. ROTEAMENTO REAL (ruas de verdade) via OSRM ---
    async function calcularRotaReal(origem, destino) {
      // OSRM espera lng,lat (invertido em relação ao Leaflet)
      const url = `https://router.project-osrm.org/route/v1/driving/` +
                  `${origem[1]},${origem[0]};${destino[1]},${destino[0]}` +
                  `?overview=full&geometries=geojson`;

      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Falha ao calcular rota');
      const data = await resp.json();
      if (!data.routes || data.routes.length === 0) throw new Error('Nenhuma rota encontrada');

      const rota = data.routes[0];
      const coordsLatLng = rota.geometry.coordinates.map(c => [c[1], c[0]]);
      return {
        coords: coordsLatLng,
        distanciaKm: rota.distance / 1000,
        duracaoMin: rota.duration / 60
      };
    }

    async function desenharRota() {
      if (!destPos) return;
      if (rotaLayer) map.removeLayer(rotaLayer);

      try {
        const btnIr = document.getElementById('btn-ir');
        btnIr.disabled = true;
        btnIr.textContent = '...';

        const rota = await calcularRotaReal(userPos, destPos);

        rotaLayer = L.polyline(rota.coords, {
          color: '#0284c7',
          weight: 6,
          opacity: 0.9,
          lineJoin: 'round'
        }).addTo(map);

        map.fitBounds(rotaLayer.getBounds(), { padding: [80, 80] });

        document.getElementById('route-time').textContent = `${Math.round(rota.duracaoMin)} min`;
        document.getElementById('route-dist').textContent = `${rota.distanciaKm.toFixed(1)} km`;
        document.getElementById('bottom-panel').classList.add('visible');

        btnIr.disabled = false;
        btnIr.textContent = '🔍 IR';
      } catch (err) {
        console.error(err);
        mostrarToast('Não foi possível calcular a rota. Tente novamente.');
        document.getElementById('btn-ir').disabled = false;
        document.getElementById('btn-ir').textContent = '🔍 IR';
      }
    }

    // --- 7. NAVEGAÇÃO E PERSPECTIVA AUTOMÁTICA ---
    async function iniciarNavegacaoInterna() {
      document.body.classList.add('modo-3d');
      ativarTelaSempreAtiva();

      // No iOS 13+, orientação do dispositivo exige permissão explícita do usuário
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissao = await DeviceOrientationEvent.requestPermission();
          if (permissao !== 'granted') {
            mostrarToast('Permissão de bússola negada — a rotação do mapa ficará fixa.');
          }
        } catch (err) {
          console.warn('Erro ao solicitar permissão de orientação:', err);
        }
      }

      iniciarAcompanhamentoGPS();
    }

    async function iniciarRota() {
      const destText = destInput.value.trim();
      if (!destText) {
        mostrarToast('Digite um endereço de destino.');
        return;
      }

      // Se o usuário não escolheu uma sugestão da lista, geocodifica o texto digitado
      if (!destPos) {
        try {
          const btnIr = document.getElementById('btn-ir');
          btnIr.disabled = true;
          btnIr.textContent = '...';
          const resultados = await geocodeEndereco(destText);
          if (!resultados || resultados.length === 0) {
            mostrarToast('Endereço não encontrado. Tente ser mais específico.');
            btnIr.disabled = false;
            btnIr.textContent = '🔍 IR';
            return;
          }
          destPos = [parseFloat(resultados[0].lat), parseFloat(resultados[0].lon)];
        } catch (err) {
          console.error(err);
          mostrarToast('Erro ao buscar o endereço. Verifique sua conexão.');
          document.getElementById('btn-ir').disabled = false;
          document.getElementById('btn-ir').textContent = '🔍 IR';
          return;
        }
      }

      document.getElementById('dest-label').textContent = destText || 'Destino';
      suggestList.style.display = 'none';
      await desenharRota();
    }

    function cancelarNavegacao() {
      document.body.classList.remove('modo-3d');
      if (rotaLayer) map.removeLayer(rotaLayer);
      document.getElementById('bottom-panel').classList.remove('visible');
      destPos = null;
      map.setView(userPos, 16);
    }

    function centralizarUsuario() {
      map.setView(userPos, 17);
    }

    // --- 8. GEOLOCALIZAÇÃO E BÚSSOLA AUTOMÁTICA ---
    function atualizarBadgeGps(ativo) {
      gpsAtivo = ativo;
      const badge = document.getElementById('gps-badge');
      badge.textContent = ativo ? 'GPS Ativo' : 'GPS Off';
      badge.classList.toggle('off', !ativo);
    }

    function iniciarAcompanhamentoGPS() {
      if (!('geolocation' in navigator)) {
        mostrarToast('Seu navegador não suporta geolocalização.');
        atualizarBadgeGps(false);
        return;
      }

      navigator.geolocation.watchPosition(pos => {
        userPos = [pos.coords.latitude, pos.coords.longitude];
        carMarker.setLatLng(userPos);
        map.setView(userPos);
        atualizarBadgeGps(true);

        if (pos.coords.heading !== null && pos.coords.heading !== undefined) {
          const carEl = document.querySelector('.car-marker div');
          if (carEl) carEl.style.transform = `translate(-50%, -50%) rotate(${pos.coords.heading}deg)`;
        }
      }, err => {
        console.warn('Erro de geolocalização:', err);
        atualizarBadgeGps(false);
        if (err.code === err.PERMISSION_DENIED) {
          mostrarToast('Permissão de localização negada. Ative o GPS para navegar.');
        } else {
          mostrarToast('Não foi possível obter sua localização.');
        }
      }, { enableHighAccuracy: true });
    }

    // Solicita localização inicial assim que o app carrega (sem precisar clicar em nada)
    function solicitarLocalizacaoInicial() {
      if (!('geolocation' in navigator)) {
        atualizarBadgeGps(false);
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        userPos = [pos.coords.latitude, pos.coords.longitude];
        carMarker.setLatLng(userPos);
        map.setView(userPos, 16);
        atualizarBadgeGps(true);
      }, err => {
        console.warn('Localização inicial indisponível:', err);
        atualizarBadgeGps(false);
      }, { enableHighAccuracy: true, timeout: 8000 });
    }

    // Rotação Automática do Dispositivo (Android e navegadores que não exigem permissão)
    window.addEventListener('deviceorientationabsolute', (e) => {
      if (e.alpha !== null && document.body.classList.contains('modo-3d')) {
        const compass = e.alpha;
        const carEl = document.querySelector('.car-marker div');
        if (carEl) carEl.style.transform = `translate(-50%, -50%) rotate(${compass}deg)`;
      }
    }, true);

    // --- 9. APPS EXTERNOS ---
    function abrirGoogleMaps() {
      if (!destPos) return;
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${destPos[0]},${destPos[1]}`, '_blank');
    }

    function abrirWaze() {
      if (!destPos) return;
      window.open(`https://waze.com/ul?ll=${destPos[0]},${destPos[1]}&navigate=yes`, '_blank');
    }

    // Inicialização
    carregarPostos(postosRJ);
    solicitarLocalizacaoInicial();
  </script>
</body>
</html>
