<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07131f">
<title>Radar Seguro RJ PRO</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
html,body,#map{width:100%;height:100%;overflow:hidden}
body{background:#07131f;color:#fff}
button,input{font:inherit}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:9px;background:rgba(0,0,0,.55)!important;color:#ddd!important}
.maplibregl-ctrl-attrib a{color:#ddd!important}

.topbar{position:fixed;top:10px;left:10px;right:10px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none;transition:.3s}
.topbar>*{pointer-events:auto}
.topbar.hide-nav{transform:translateY(-120%);opacity:0;pointer-events:none}

.appbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:16px;background:rgba(4,16,28,.94);border:1px solid rgba(56,189,248,.25);box-shadow:0 8px 24px #0007;backdrop-filter:blur(12px)}
.brand{font-size:13px;font-weight:900}.brand span{color:#38bdf8}
.badges{display:flex;gap:5px}.badge{font-size:9px;font-weight:900;padding:5px 7px;border-radius:999px;background:#075985}.badge.off{background:#475569}.badge.ok{background:#059669}

.search{position:relative;display:flex;gap:4px;padding:5px;background:#07131ff5;border:1px solid #38bdf8;border-radius:15px;box-shadow:0 8px 24px #0008}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:10px 8px;font-size:14px}.search input::placeholder{color:#94a3b8}
.search button{border:0;border-radius:11px;background:#0284c7;color:#fff;font-weight:900;padding:10px 13px;cursor:pointer}.search .clear{background:#1e293b}
.suggest{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:280px;overflow:auto;border:1px solid #334155;border-radius:14px;background:#07131f;box-shadow:0 12px 30px #0009;z-index:40}
.suggest.show{display:block}.suggest-item{padding:12px;border-bottom:1px solid #1e293b;font-size:12px;color:#e2e8f0;line-height:1.35;cursor:pointer}.suggest-item:active{background:#102337}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #334155;background:#04101ce8;color:#dbeafe;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}
.chip.active{background:#075985;border-color:#38bdf8}

/* WAZE HUD BANNER */
.waze-top-hud{position:fixed;top:0;left:0;right:0;z-index:30;background:#000;color:#fff;padding:12px 16px 8px;box-shadow:0 6px 20px #000a;display:none;flex-direction:column}
.waze-top-hud.show{display:flex}
.waze-maneuver-row{display:flex;align-items:center;gap:16px}
.waze-arrow{font-size:44px;line-height:1;font-weight:900;color:#fff;transform:translateY(-2px)}
.waze-meta{flex:1}
.waze-dist{font-size:24px;font-weight:900;letter-spacing:-0.5px}
.waze-street{font-size:20px;font-weight:900;color:#38bdf8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.waze-sub-hud{background:#111;margin:8px -16px -8px;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:#cbd5e1;border-top:1px solid #222}
.waze-sub-hud span.next-name{color:#fff}
.waze-danger-tag{color:#f87171;font-weight:900;display:none}
.waze-danger-tag.active{display:inline}

/* SIDE BUTTONS */
.side{position:fixed;right:12px;top:165px;z-index:20;display:flex;flex-direction:column;gap:9px;transition:.3s}
.side button{width:48px;height:48px;border-radius:50%;border:1px solid #334155;background:#000c;color:#fff;box-shadow:0 7px 18px #0008;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.side button.locate{border-color:#38bdf8}
.side button.sv{background:#0369a1;border-color:#38bdf8}

/* BOTTOM RETRACTABLE WAZE PANEL */
.waze-bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#ffffff;color:#0f172a;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,0.35);transition:transform .3s cubic-bezier(0.1,0.9,0.2,1);transform:translateY(calc(100% - 75px));display:none}
.waze-bottom-sheet.show{display:block}
.waze-bottom-sheet.expanded{transform:translateY(0)}
.sheet-handle{width:40px;height:5px;background:#cbd5e1;border-radius:99px;margin:8px auto 4px;cursor:pointer}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 12px;cursor:pointer}
.sheet-recenter{display:flex;align-items:center;gap:10px}
.recenter-icon{width:40px;height:40px;border-radius:50%;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.sheet-time-dist{display:flex;flex-direction:column}
.sheet-time-dist b{font-size:18px;font-weight:900;color:#0f172a}
.sheet-time-dist span{font-size:13px;color:#64748b;font-weight:700}
.sheet-toggle-btn{padding:8px 14px;border-radius:99px;background:#f1f5f9;color:#0284c7;font-size:13px;font-weight:900;border:0}

.sheet-content{padding:0 18px 20px;border-top:1px solid #f1f5f9;display:flex;flex-direction:column;gap:10px}
.sheet-nav-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sheet-nav-actions button{border:0;border-radius:14px;padding:12px;font-size:13px;font-weight:900;color:#fff;cursor:pointer}
.btn-nav-radar{background:#0284c7}.btn-nav-stop{background:#dc2626}
.sheet-external-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-external-grid button{border:1px solid #cbd5e1;background:#f8fafc;color:#1e293b;border-radius:12px;padding:11px;font-size:12px;font-weight:800;cursor:pointer}

/* MAP USER ARROW */
.user-marker-waze{width:36px;height:36px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="%230284c7" opacity="0.3"/><path d="M20 4 L33 32 L20 26 L7 32 Z" fill="%2300f2fe" stroke="%23ffffff" stroke-width="2.5"/></svg>') no-repeat center/contain;transform:translate(-50%,-50%)}
.fuel-marker{width:28px;height:28px;border-radius:50%;background:#0ea5e9;border:2px solid #fff;box-shadow:0 3px 10px #0008;display:flex;align-items:center;justify-content:center;font-size:14px}
.fuel-marker.gnv{background:#16a34a}

.bottom-actions{position:fixed;left:10px;right:10px;bottom:12px;z-index:20;display:flex;gap:7px;transition:.3s}
.bottom-actions.hide-nav{transform:translateY(150%);pointer-events:none}
.action{flex:1;border:0;border-radius:15px;padding:13px 7px;background:#000e;color:#fff;font-size:11px;font-weight:900;box-shadow:0 8px 22px #0008;cursor:pointer}
.action.primary{background:#0284c7}.action.danger{background:#991b1b}.action.anp{background:#166534}

.toast{position:fixed;left:50%;bottom:145px;transform:translate(-50%,20px);z-index:100;opacity:0;pointer-events:none;background:#111827;border:1px solid #38bdf8;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:700;max-width:90vw;text-align:center;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}

.modal{display:none;position:fixed;inset:0;z-index:90;background:#0009;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;background:#07131f;border-radius:22px 22px 0 0;padding:18px;border-top:1px solid #334155}.sheet h2{font-size:18px;margin-bottom:8px}.sheet p{font-size:12px;color:#94a3b8;line-height:1.45;margin-bottom:14px}.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sheet-grid button{border:1px solid #334155;border-radius:13px;padding:12px;background:#0b1b2a;color:#fff;text-align:left;font-weight:800;cursor:pointer}.sheet-close{width:100%;border:0;border-radius:12px;padding:12px;background:#1e293b;color:#fff;font-weight:900;margin-top:12px;cursor:pointer}

@media(min-width:700px){
.topbar{left:20px;right:auto;width:460px}.waze-bottom-sheet{left:20px;right:auto;width:430px;border-radius:20px}.bottom-actions{left:auto;right:20px;width:430px}
}
</style>
</head>

<body>
<div id="map"></div>

<div class="topbar" id="mainTopbar">

    <button class="clear" id="clearBtn">✕</button>
    <button id="searchBtn">IR</button>
    <div id="suggest" class="suggest"></div>
  </div>

  <div class="chips">

    <button class="chip active" id="communityChip">🟥 Zonas de Risco</button>
    <button class="chip" id="themeChip">🌓 Tema: Auto</button>
    <button class="chip" id="satChip">🛰️ Satélite</button>
  </div>
</div>

<div class="waze-top-hud" id="wazeHud">
  <div class="waze-maneuver-row">
    <div class="waze-arrow" id="hudArrow">↰</div>
    <div class="waze-meta">
      <div class="waze-dist" id="hudDist">110 m</div>
      <div class="waze-street" id="hudStreet">Rua de Destino</div>
    </div>
  </div>
  <div class="waze-sub-hud">

    <div class="waze-danger-tag" id="hudDangerTag">⚠ ALERTA DE ÁREA</div>
  </div>
</div>

<div class="side" id="sideControls">
  <button class="locate" id="locateBtn" title="Onde estou">◎</button>
  <button class="sv" id="streetViewBtn" title="Abrir Google Street View">👁️</button>
  <button id="northBtn" title="Norte">N</button>
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="layersBtn">☷</button>
</div>

<div class="waze-bottom-sheet" id="wazeSheet">
  <div class="sheet-handle" id="sheetHandle"></div>
  <div class="sheet-bar" id="sheetBar">
    <div class="sheet-recenter" id="btnRecenter">
      <div class="recenter-icon">🎯</div>
      <div class="sheet-time-dist">
        <b id="sheetTime">-- min</b>
        <span id="sheetDist">-- km • Chegada prevista</span>
      </div>
    </div>
    <button class="sheet-toggle-btn" id="sheetToggleBtn">Opções ▴</button>
  </div>
  
  <div class="sheet-content">
    <div class="sheet-nav-actions">
      <button class="btn-nav-radar" id="startRadarBtn">▶ Iniciar Radar Seguro</button>
      <button class="btn-nav-stop" id="stopNavBtn">⏹ Parar</button>
    </div>
    <div class="sheet-external-grid">
      <button id="openWaze">Abrir no Waze</button>
      <button id="openMaps">Abrir Google Maps</button>
    </div>
  </div>
</div>

<div class="bottom-actions" id="mainBottomActions">
  <button class="action danger" id="reportBtn">🚨 Denunciar</button>
  <button class="action primary" id="postosBtn">⛽ Postos</button>
  <button class="action anp" id="anpBtn">🏛️ ANP</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="layersModal">
  <div class="sheet">
    <h2>Camadas e Serviços</h2>
    <p>Monitoramento de zonas de risco de 300m a 500m com visibilidade adaptativa.</p>
    <div class="sheet-grid">
      <button id="modalTheme">🌓 Alternar Tema</button>
      <button id="modalCommunity">🟥 Zonas de Risco</button>
      <button id="modalFuel">⛽ Postos</button>
      <button id="modalSatellite">🛰️ Satélite</button>
      <button id="modalStreetView">👁️ Google Street View</button>
      <button id="modalLocate">📍 Minha Posição</button>
    </div>
    <button class="sheet-close" id="closeLayers">Fechar</button>
  </div>
</div>

  const rLat = rKm / 111.0;
  const rLon = rKm / (111.0 * Math.cos(lat * Math.PI / 180));
  return [
    [+(lon - rLon).toFixed(5), +(lat - rLat).toFixed(5)],
    [+(lon + rLon).toFixed(5), +(lat - rLat).toFixed(5)],
    [+(lon + rLon).toFixed(5), +(lat + rLat).toFixed(5)],

function distanceKm(a,b){
const R=6371,lat1=a[1]*Math.PI/180,lat2=b[1]*Math.PI/180;
const dLat=(b[1]-a[1])*Math.PI/180,dLon=(b[0]-a[0])*Math.PI/180;
const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
return 2*R*Math.asin(Math.sqrt(h));
}

async function loadFuelStations(force=false){

const q=`[out:json][timeout:20];(node["amenity"="fuel"](around:6000,${center[1]},${center[0]});way["amenity"="fuel"](around:6000,${center[1]},${center[0]}););out center tags;`;
try{
const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
if(!r.ok)throw Error('Overpass');
const data=await r.json();renderFuel(data.elements||[]);
}catch(e){console.warn(e)}
finally{isFuelLoading=false}
}

function normalizeQuery(q){

return q;
}
function nomText(r){

return [r.name,a.road,a.house_number,a.suburb,a.city||a.town||a.municipality,a.state].filter(Boolean).join(', ')||r.display_name;
}

async function nominatim(q){
const p=new URLSearchParams({format:'jsonv2',addressdetails:'1',limit:'8',countrycodes:'br',bounded:'1',viewbox:'-44.85,-22.60,-43.00,-23.40',q});
const r=await fetch('https://nominatim.openstreetmap.org/search?'+p,{headers:{'Accept-Language':'pt-BR,pt;q=.9'},signal:geocodeAbort.signal});
if(!r.ok)throw Error('Nominatim');
return r.json();
}
async function photon(q){
const c=userPos||map.getCenter().toArray();
const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lat=${c[1]}&lon=${c[0]}&lang=pt`,{signal:geocodeAbort.signal});
if(!r.ok)throw Error('Photon');
const j=await r.json();
return (j.features||[]).map(f=>({lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],display_name:photonText(f)}));
}
async function geocode(q){
const wait=Math.max(0,1100-(Date.now()-lastGeocodeAt));if(wait)await new Promise(r=>setTimeout(r,wait));
lastGeocodeAt=Date.now();geocodeAbort?.abort();geocodeAbort=new AbortController();
q=normalizeQuery(q);
try{
const r=await nominatim(q);
if(r.length)return r.map(x=>({lat:x.lat,lon:x.lon,display_name:nomText(x)}));
}catch(e){if(e.name==='AbortError')throw e;}
return photon(q);
}

function allSteps(){return(routeData?.legs||[]).flatMap(l=>l.steps||[])}
function stepIconArrow(s){
  const m=s.maneuver||{};
  if(m.type==='arrive') return '🏁';
  if(m.modifier==='left'||m.modifier==='sharp left') return '↰';
  if(m.modifier==='slight left') return '↖';
  if(m.modifier==='right'||m.modifier==='sharp right') return '↱';
  if(m.modifier==='slight right') return '↗';
  if(m.type==='roundabout'||m.type==='rotary') return '🔄';
  return '⬆';
}

function updateNavigation(){
if(!navActive||!userPos||!routeData)return;
const steps=allSteps();if(!steps.length)return;
let best=0,bestDist=Infinity;
steps.forEach((s,i)=>{const c=s.maneuver?.location;if(!c)return;const d=distanceKm(userPos,c);if(d<bestDist){bestDist=d;best=i}});
currentStep=best;
const s=steps[currentStep],next=steps[currentStep+1];

const distMeters = Math.round(bestDist * 1000);
document.getElementById('hudDist').textContent = distMeters < 1000 ? `${distMeters} m` : `${(distMeters/1000).toFixed(1)} km`;
document.getElementById('hudArrow').textContent = stepIconArrow(s);
document.getElementById('hudStreet').textContent = s.name || 'Siga na via indicada';

if(next){
  document.getElementById('hudNextIcon').textContent = stepIconArrow(next);
  document.getElementById('hudNextStreet').textContent = next.name || 'Próximo acesso';
}else{
  document.getElementById('hudNextStreet').textContent = 'Destino final';
}

if(currentStep!==lastAnnouncedStep && bestDist<.09){
  lastAnnouncedStep=currentStep;
  if('speechSynthesis'in window){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s.name?`Acesse ${s.name}`:'Siga em frente');u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
}
}

document.getElementById('reportBtn').onclick=()=>openExternal(ANP_REPORT);
document.getElementById('anpBtn').onclick=()=>openExternal(ANP_APP);
document.getElementById('postosBtn').onclick=()=>{if(!fuelVisible)toggleFuel();locate();loadFuelStations(true)};

document.getElementById('layersBtn').onclick=()=>document.getElementById('layersModal').classList.add('show');
document.getElementById('closeLayers').onclick=()=>document.getElementById('layersModal').classList.remove('show');
document.getElementById('modalFuel').onclick=toggleFuel;
document.getElementById('modalCommunity').onclick=toggleCommunity;
document.getElementById('modalSatellite').onclick=toggleSatellite;
document.getElementById('modalLocate').onclick=()=>{document.getElementById('layersModal').classList.remove('show');locate()};

document.getElementById('searchBtn').onclick=iniciarRota;
window.addEventListener('pagehide',()=>{if(watchId!=null)navigator.geolocation.clearWatch(watchId);wakeLock?.release?.()});
</script>
</body>
</html>
