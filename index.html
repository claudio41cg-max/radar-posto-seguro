<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111f">
<title>Radar Seguro RJ PRO</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<style>
:root{--bg:#07111f;--panel:rgba(7,17,31,.95);--line:#29415a;--text:#fff;--muted:#9fb0c5;--blue:#12b8f5;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}html,body,#map{width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:#fff}.top{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-direction:column;gap:7px;pointer-events:none}.top>*{pointer-events:auto}.header{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid #20364c;border-radius:16px;padding:9px 11px;backdrop-filter:blur(14px);box-shadow:0 8px 25px #0008}.brand{font-size:12px;font-weight:900;color:#8de2ff}.badges{display:flex;gap:5px}.badge{font-size:9px;font-weight:900;padding:4px 7px;border-radius:99px}.gps{background:#155e3a}.gps.off{background:#475569}.alert{background:#17466a}.search{position:relative;display:flex;background:var(--panel);border:1px solid #24506c;border-radius:16px;box-shadow:0 8px 25px #0008}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:13px;font-size:14px}.search button{margin:4px;border:0;border-radius:12px;background:#0ea5e9;color:#fff;padding:0 15px;font-weight:900}.suggest{position:absolute;top:calc(100% + 5px);left:0;right:0;display:none;max-height:250px;overflow:auto;background:#0b1728;border:1px solid #29415a;border-radius:14px;box-shadow:0 12px 35px #000b}.sug{padding:11px;border-bottom:1px solid #1d3044;font-size:12px;line-height:1.4}.filters{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #29415a;background:rgba(7,17,31,.92);color:#dbeafe;border-radius:99px;padding:8px 11px;font-size:11px;font-weight:800}.chip.active{background:#087caf;border-color:#25c7ff}.side{position:fixed;z-index:18;right:11px;top:180px;display:flex;flex-direction:column;gap:8px}.fab{width:46px;height:46px;border-radius:50%;border:1px solid #ffffff26;background:#040a12eb;color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 7px 20px #0009}.fab.loc{border-color:#12b8f5}.bottom{position:fixed;z-index:20;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:none;background:#050c16f5;border:1px solid #20344a;border-radius:22px;box-shadow:0 -4px 35px #000a;overflow:hidden}.bottom.show{display:block}.route{padding:12px 14px 9px}.route-row{display:flex;align-items:center;gap:10px}.turn{width:42px;height:42px;border-radius:13px;background:#0c83b8;display:grid;place-items:center;font-size:22px}.route-main{flex:1;min-width:0}.route-main b{font-size:25px;color:#8ce6ad}.route-main small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cancel{background:#121d2b;color:#fff;border:1px solid #3b4b5d;border-radius:10px;padding:8px}.metrics{display:flex;gap:10px;color:#b5c3d3;font-size:13px;margin-top:6px}.instruction{margin-top:8px;background:#0d2035;border-radius:11px;padding:8px;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:0 12px 12px}.act{border:0;border-radius:11px;padding:10px 5px;color:#fff;font-size:11px;font-weight:900;background:#12314a}.start{background:#0ea5e9}.anp{background:#72520c}.report{background:#7f1d1d}.full{grid-column:1/-1;background:#126f48}.toast{position:fixed;z-index:100;left:50%;bottom:120px;transform:translate(-50%,20px);background:#101d2e;border:1px solid #31506d;color:#fff;padding:10px 14px;border-radius:12px;max-width:90vw;text-align:center;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.sheet{position:fixed;z-index:30;left:10px;right:10px;bottom:10px;display:none;background:#07111f;border:1px solid #29415a;border-radius:22px;padding:15px;box-shadow:0 10px 40px #000d}.sheet.show{display:block}.close{float:right;background:#17263a;color:#fff;border:0;border-radius:8px;padding:7px}.layer{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #1b2c40}.switch{width:48px;height:27px;border:0;border-radius:99px;background:#334155;padding:3px}.switch i{display:block;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:#0ea5e9}.switch.on i{transform:translateX(21px)}.user-dot{width:22px;height:22px;border-radius:50%;background:#1976ff;border:3px solid #fff;box-shadow:0 0 0 7px #1976ff38,0 2px 8px #0008}.community-label{color:#fff;background:#7f1d1dd9;border:1px solid #ef4444;border-radius:99px;padding:4px 7px;font-size:10px;font-weight:900;white-space:nowrap}.station{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 9px #0009;font-size:12px}.maplibregl-popup-content{background:#091626!important;color:#fff!important;border:1px solid #29415a;border-radius:14px!important;padding:13px!important}.maplibregl-popup-tip{border-top-color:#091626!important}.popup-title{font-weight:900;font-size:14px;margin-bottom:6px}.popup-muted{font-size:11px;color:#a9bbce;line-height:1.4}.popup-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.popup-actions a{color:#fff;text-decoration:none;text-align:center;padding:8px;border-radius:9px;background:#0d79a8;font-size:10px;font-weight:900}.popup-actions a.red{background:#8b1e1e}.popup-actions a.yellow{background:#73520d}
</style></head><body>
<div id="map"></div>
<div class="top"><div class="header"><div class="brand">🛡️ RADAR SEGURO RJ PRO</div><div class="badges"><span class="badge alert">ALERTA ON</span><span id="gps" class="badge gps off">GPS...</span></div></div><div class="search"><input id="dest" placeholder="Para onde você vai?" autocomplete="off"><button id="go">IR</button><div id="suggest" class="suggest"></div></div><div class="filters"><button class="chip active" data-f="all">⛽ Postos</button><button class="chip" data-f="gnv">🟢 GNV</button><button class="chip" data-f="near">📍 Próximos</button><button class="chip" id="layers">☰ Camadas</button></div></div>
<div class="side"><button class="fab loc" id="loc">◎</button><button class="fab" id="north">N</button><button class="fab" id="zin">+</button><button class="fab" id="zout">−</button></div>
<div id="toast" class="toast"></div>
<div id="bottom" class="bottom"><div class="route"><div class="route-row"><div class="turn">➤</div><div class="route-main"><b id="time">-- min</b><small id="rdest">Destino</small></div><button class="cancel" id="cancel">✕</button></div><div class="metrics"><span id="dist">-- km</span><span id="alts">rota mais rápida</span></div><div id="instruction" class="instruction">Pronto para navegar.</div></div><div class="actions"><button class="act start" id="start">▶ Iniciar</button><button class="act anp" id="anp">🏛️ ANP</button><button class="act report" id="report">🚨 Denunciar</button><button class="act full" id="voice">🔊 Orientação por voz: OFF</button></div></div>
<div id="sheet" class="sheet"><button class="close" id="close">✕</button><h3>Camadas do Radar</h3><div class="layer"><span>⛽ Postos</span><button class="switch on" data-layer="stations"><i></i></button></div><div class="layer"><span>🛡️ Comunidades delimitadas</span><button class="switch on" data-layer="communities"><i></i></button></div><div class="layer"><span>🛰️ Satélite</span><button class="switch" data-layer="sat"><i></i></button></div><p style="font-size:11px;color:#8fa3b8;line-height:1.5;margin-top:12px">As áreas das comunidades são limites cadastrados neste projeto. Não significam, por si só, classificação oficial de risco.</p></div>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
const CFG={nominatim:'https://nominatim.openstreetmap.org/search',photon:'https://photon.komoot.io/api/',osrm:'https://router.project-osrm.org/route/v1/driving/',overpass:'https://overpass-api.de/api/interpreter',anp:'https://anpcomvcpostos.anp.gov.br/',denuncia:'https://www.gov.br/anp/pt-br/canais_atendimento/reclamacoes-e-denuncias-contra-postos-de-combustiveis-revendas-de-glp-inclusive-programa-gas-do-povo-e-outros-agentes-regulados'};
const comunidades=[{nome:'Comunidade do Aço / Vila Paciência',c:[[-43.628,-22.898],[-43.621,-22.895],[-43.623,-22.903],[-43.629,-22.901],[-43.628,-22.898]]},{nome:'Comunidade Antares',c:[[-43.648,-22.905],[-43.641,-22.903],[-43.643,-22.912],[-43.65,-22.909],[-43.648,-22.905]]},{nome:'Comunidade Cesarão',c:[[-43.66,-22.91],[-43.652,-22.908],[-43.655,-22.918],[-43.662,-22.915],[-43.66,-22.91]]}];
let user=null,destPos=null,current=null,stations=[],labels=[],nav=false,voiceOn=false,controller=null,lastSearch=0,timer=null;
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256},sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256}},layers:[{id:'osm',type:'raster',source:'osm'},{id:'sat',type:'raster',source:'sat',layout:{visibility:'none'}}]},center:[-43.5,-22.91],zoom:12});
const geo=new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true,showUserLocation:false,showAccuracyCircle:false});
map.addControl(geo,'bottom-right');
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),3200)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function gps(on,t){let e=document.getElementById('gps');e.textContent=t;e.classList.toggle('off',!on)}
let userMarker=null;function setUser(){if(!user)return;if(!userMarker){let e=document.createElement('div');e.className='user-dot';userMarker=new maplibregl.Marker({element:e}).setLngLat(user).addTo(map)}else userMarker.setLngLat(user)}
geo.on('geolocate',e=>{let first=!user;user=[e.coords.longitude,e.coords.latitude];setUser();gps(true,'GPS Ativo');if(first){map.flyTo({center:user,zoom:16,duration:700})}if(nav&&destPos){map.easeTo({center:user,zoom:17.5,pitch:52,duration:300})}});
geo.on('error',e=>{gps(false,e.code===1?'GPS Bloqueado':'GPS...');toast(e.code===1?'Permita a localização no navegador':'Não foi possível obter sua localização')});
document.getElementById('loc').onclick=()=>{if(user){map.flyTo({center:user,zoom:17,duration:700})}else{geo.trigger()}};
document.getElementById('north').onclick=()=>map.easeTo({bearing:0,duration:500});document.getElementById('zin').onclick=()=>map.zoomIn();document.getElementById('zout').onclick=()=>map.zoomOut();
map.on('load',()=>{let fc={type:'FeatureCollection',features:comunidades.map(x=>({type:'Feature',geometry:{type:'Polygon',coordinates:[x.c]},properties:{nome:x.nome}}))};map.addSource('comunidades',{type:'geojson',data:fc});map.addLayer({id:'com-fill',type:'fill',source:'comunidades',paint:{'fill-color':'#ef4444','fill-opacity':.16}});map.addLayer({id:'com-line',type:'line',source:'comunidades',paint:{'line-color':'#ff4242','line-width':3}});comunidades.forEach(x=>{let c=x.c.reduce((a,p)=>[a[0]+p[0],a[1]+p[1]],[0,0]);c=[c[0]/x.c.length,c[1]/x.c.length];let e=document.createElement('div');e.className='community-label';e.textContent='⚠ '+x.nome;labels.push(new maplibregl.Marker({element:e}).setLngLat(c).addTo(map))});loadStations();geo.trigger()});
async function loadStations(){let c=map.getCenter(),q=`[out:json][timeout:18];(node["amenity"="fuel"](around:12000,${c.lat},${c.lng});way["amenity"="fuel"](around:12000,${c.lat},${c.lng}););out center tags;`;try{let r=await fetch(CFG.overpass,{method:'POST',body:q,headers:{'Content-Type':'text/plain'}});if(!r.ok)throw 0;let d=await r.json();clearStations();let seen=new Set();(d.elements||[]).slice(0,120).forEach(s=>{let p=s.center||s;if(!p.lat||!p.lon)return;let k=p.lat.toFixed(5)+','+p.lon.toFixed(5);if(seen.has(k))return;seen.add(k);let t=s.tags||{},gnv=t['fuel:gnv']==='yes'||t['fuel:cng']==='yes';addStation(p.lat,p.lon,t.name||'Posto de combustível',t.brand||t.operator||'Não informado',gnv)})}catch(e){console.warn(e);toast('Postos indisponíveis no momento')}}
function clearStations(){stations.forEach(x=>x.remove());stations=[]}function addStation(lat,lon,name,brand,gnv){let e=document.createElement('div');e.className='station';e.style.background=gnv?'#16803b':'#155e9b';e.textContent=gnv?'G':'⛽';let html=`<div class="popup-title">${esc(name)}</div><div class="popup-muted">Bandeira/operador: ${esc(brand)}<br>${gnv?'🟢 GNV indicado no cadastro do mapa':'Combustível'}<br><br>A situação oficial, autorização e histórico devem ser conferidos na ANP.</div><div class="popup-actions"><a class="yellow" href="${CFG.anp}" target="_blank">🏛️ ANP</a><a class="red" href="${CFG.denuncia}" target="_blank">🚨 Denunciar</a><a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" target="_blank">🧭 Rota</a><a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank">📍 Maps</a></div>`;let m=new maplibregl.Marker({element:e}).setLngLat([lon,lat]).setPopup(new maplibregl.Popup({offset:17}).setHTML(html)).addTo(map);m.info={lat,lon,gnv};stations.push(m)}
function filter(f){stations.forEach(m=>{let s=m.info,show=f==='all'||(f==='gnv'&&s.gnv)||(f==='near'&&user&&dist(user[1],user[0],s.lat,s.lon)<=5);m.getElement().style.display=show?'grid':'none'})}function dist(a,b,c,d){let R=6371,A=(c-a)*Math.PI/180,B=(d-b)*Math.PI/180,x=Math.sin(A/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(B/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
const input=document.getElementById('dest'),suggest=document.getElementById('suggest');async function search(q){if(controller)controller.abort();controller=new AbortController();let wait=Math.max(0,1100-(Date.now()-lastSearch));if(wait)await new Promise(r=>setTimeout(r,wait));lastSearch=Date.now();let box='-44.10,-22.55,-43.00,-23.35',url=CFG.nominatim+`?format=jsonv2&addressdetails=1&limit=7&countrycodes=br&bounded=1&viewbox=${encodeURIComponent(box)}&q=${encodeURIComponent(q)}`;try{let r=await fetch(url,{signal:controller.signal,headers:{'Accept-Language':'pt-BR'}});if(r.ok){let a=await r.json();if(a.length)return a.map(x=>({lat:+x.lat,lon:+x.lon,label:x.display_name}))}}catch(e){if(e.name==='AbortError')throw e}let r=await fetch(CFG.photon+`?q=${encodeURIComponent(q)}&limit=7&lang=pt`,{signal:controller.signal});let p=await r.json();return(p.features||[]).map(x=>{let [lon,lat]=x.geometry.coordinates,t=x.properties||{};return{lat,lon,label:[t.name,t.street,t.housenumber,t.district,t.city||t.locality,t.state].filter(Boolean).join(', ')}})}
function show(a){suggest.innerHTML='';if(!a.length){suggest.style.display='none';return}a.forEach(x=>{let e=document.createElement('div');e.className='sug';e.innerHTML='📍 '+esc(x.label);e.onclick=()=>{destPos=[x.lon,x.lat];input.value=x.label;suggest.style.display='none';map.flyTo({center:destPos,zoom:16,duration:700})};suggest.appendChild(e)});suggest.style.display='block'}input.addEventListener('input',()=>{clearTimeout(timer);destPos=null;if(input.value.trim().length<4){suggest.style.display='none';return}timer=setTimeout(()=>search(input.value.trim()).then(show).catch(()=>{}),650)});document.addEventListener('click',e=>{if(!e.target.closest('.search'))suggest.style.display='none'});input.addEventListener('keydown',e=>{if(e.key==='Enter')route()});
async function route(){try{if(!user){geo.trigger();await new Promise((res,rej)=>{let n=0,t=setInterval(()=>{if(user){clearInterval(t);res()}else if(++n>25){clearInterval(t);rej(new Error('GPS não respondeu'))}},200)})}if(!destPos){let a=await search(input.value.trim());if(!a.length)throw new Error('Endereço não encontrado');destPos=[a[0].lon,a[0].lat];input.value=a[0].label}let u=CFG.osrm+`${user[0]},${user[1]};${destPos[0]},${destPos[1]}?overview=full&geometries=geojson&steps=true&alternatives=true`;let r=await fetch(u),d=await r.json();if(d.code!=='Ok')throw new Error('Rota não encontrada');current=d.routes[0];draw(d.routes);panel();}catch(e){toast(e.message||'Falha ao calcular rota')}}
function draw(rs){let fc={type:'FeatureCollection',features:rs.map((r,i)=>({type:'Feature',properties:{sel:i===0},geometry:r.geometry}))};if(map.getSource('route'))map.getSource('route').setData(fc);else{map.addSource('route',{type:'geojson',data:fc});map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':['case',['get','sel'],'#12c9ff','#77879a'],'line-width':['case',['get','sel'],7,4],'line-opacity':['case',['get','sel'],.95,.45]}})}let co=rs[0].geometry.coordinates,b=co.reduce((x,c)=>x.extend(c),new maplibregl.LngLatBounds(co[0],co[0]));map.fitBounds(b,{padding:{top:150,bottom:230,left:25,right:25},duration:700})}
function panel(){document.getElementById('bottom').classList.add('show');document.getElementById('time').textContent=Math.max(1,Math.round(current.duration/60))+' min';document.getElementById('dist').textContent=(current.distance/1000).toFixed(1)+' km';document.getElementById('rdest').textContent=input.value;document.getElementById('instruction').textContent=stepText(current)}function stepText(r){let s=r.legs?.[0]?.steps?.[0];if(!s)return'Siga pela rota destacada.';let type=s.maneuver?.type||'continue',m=s.maneuver?.modifier||'',n=s.name?' em '+s.name:'';let x={turn:'Vire',depart:'Siga',continue:'Continue',merge:'Entre',fork:'Mantenha-se',roundabout:'Entre na rotatória',arrive:'Você chegou'}[type]||'Siga';return x+(m?' '+m:'')+n+'.'}
document.getElementById('go').onclick=route;document.getElementById('cancel').onclick=()=>{nav=false;destPos=null;current=null;document.getElementById('bottom').classList.remove('show');if(map.getLayer('route'))map.removeLayer('route');if(map.getSource('route'))map.removeSource('route')};document.getElementById('start').onclick=()=>{nav=!nav;document.getElementById('start').textContent=nav?'■ Parar':'▶ Iniciar';if(nav)map.easeTo({center:user,zoom:17.5,pitch:52,duration:600});else map.easeTo({pitch:0,duration:500})};document.getElementById('voice').onclick=()=>{voiceOn=!voiceOn;document.getElementById('voice').textContent='🔊 Orientação por voz: '+(voiceOn?'ON':'OFF');if(voiceOn&&speechSynthesis){let u=new SpeechSynthesisUtterance('Orientação por voz ativada');u.lang='pt-BR';speechSynthesis.speak(u)}};
document.getElementById('anp').onclick=()=>open(CFG.anp,'_blank');document.getElementById('report').onclick=()=>open(CFG.denuncia,'_blank');document.getElementById('layers').onclick=()=>document.getElementById('sheet').classList.add('show');document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('show');
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter(b.dataset.f)});document.querySelectorAll('.switch').forEach(b=>b.onclick=()=>{b.classList.toggle('on');let on=b.classList.contains('on'),l=b.dataset.layer;if(l==='stations')stations.forEach(x=>x.getElement().style.display=on?'grid':'none');if(l==='communities'){['com-fill','com-line'].forEach(i=>map.getLayer(i)&&map.setLayoutProperty(i,'visibility',on?'visible':'none'));labels.forEach(x=>x.getElement().style.display=on?'block':'none')}if(l==='sat'){map.setLayoutProperty('sat','visibility',on?'visible':'none');map.setLayoutProperty('osm','visibility',on?'none':'visible')}});map.on('moveend',()=>{if(!map.getSource('route'))loadStations()});
</script></body></html>
