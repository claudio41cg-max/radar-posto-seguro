<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">

<title>Radar Seguro RJ PRO</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
html,body,#map{width:100%;height:100%;overflow:hidden}
body{background:#07131f;color:#fff}
button,input{font:inherit}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:9px;background:rgba(0,0,0,.55)!important;color:#ddd!important}
.maplibregl-ctrl-attrib a{color:#ddd!important}

.topbar{position:fixed;top:10px;left:10px;right:10px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:16px;background:rgba(4,16,28,.94);border:1px solid rgba(56,189,248,.25);box-shadow:0 8px 24px #0007;backdrop-filter:blur(12px)}
.brand{font-size:13px;font-weight:900}.brand span{color:#38bdf8}
.badges{display:flex;gap:5px}.badge{font-size:9px;font-weight:900;padding:5px 7px;border-radius:999px;background:#075985}.badge.off{background:#475569}.badge.ok{background:#059669}

.search{position:relative;display:flex;gap:4px;padding:5px;background:#07131ff5;border:1px solid #38bdf8;border-radius:15px;box-shadow:0 8px 24px #0008}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:10px 8px;font-size:14px}.search input::placeholder{color:#94a3b8}
.search button{border:0;border-radius:11px;background:#0284c7;color:#fff;font-weight:900;padding:10px 13px}.search .clear{background:#1e293b}
.suggest{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:280px;overflow:auto;border:1px solid #334155;border-radius:14px;background:#07131f;box-shadow:0 12px 30px #0009;z-index:40}
.suggest.show{display:block}.suggest-item{padding:12px;border-bottom:1px solid #1e293b;font-size:12px;color:#e2e8f0;line-height:1.35}.suggest-item:active{background:#102337}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #334155;background:#04101ce8;color:#dbeafe;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}
.chip.active{background:#075985;border-color:#38bdf8}.chip.red.active{background:#7f1d1d;border-color:#f87171}

.side{position:fixed;right:12px;top:165px;z-index:20;display:flex;flex-direction:column;gap:9px}
.side button{width:48px;height:48px;border-radius:50%;border:1px solid #334155;background:#000c;color:#fff;box-shadow:0 7px 18px #0008;font-size:20px;cursor:pointer}
.side button.locate{border-color:#38bdf8}

.bottom-actions{position:fixed;left:10px;right:10px;bottom:12px;z-index:20;display:flex;gap:7px}
.action{flex:1;border:0;border-radius:15px;padding:13px 7px;background:#000e;color:#fff;font-size:11px;font-weight:900;box-shadow:0 8px 22px #0008;cursor:pointer}
.action.primary{background:#0284c7}.action.danger{background:#991b1b}.action.anp{background:#166534}

.route-panel{position:fixed;left:10px;right:10px;bottom:75px;z-index:25;display:none;background:#020a12f7;border:1px solid #1e3a4f;border-radius:20px;padding:14px;box-shadow:0 15px 40px #000b;backdrop-filter:blur(14px)}
.route-panel.show{display:block}.route-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.route-dest{font-size:14px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close-route{border:0;background:#1e293b;color:#fff;border-radius:10px;padding:7px 9px;cursor:pointer}
.route-main{display:flex;align-items:end;gap:10px;margin:10px 0}.route-time{font-size:30px;font-weight:900;color:#7dd3fc}.route-dist{font-size:14px;color:#94a3b8;padding-bottom:4px}
.route-options{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}.route-card{min-width:125px;border:1px solid #334155;background:#0b1b2a;border-radius:12px;padding:9px;cursor:pointer}.route-card.active{border-color:#38bdf8;background:#082f49}.route-card b{font-size:16px}.route-card span{display:block;font-size:10px;color:#94a3b8;margin-top:3px}
.route-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.route-buttons button{border:0;border-radius:11px;padding:11px;font-weight:900;color:#fff;cursor:pointer}.start{background:#059669}.external{background:#334155}

.nav-banner{position:fixed;top:10px;left:10px;right:10px;z-index:35;display:none;border-radius:20px;padding:15px 18px;background:#034444fa;border:2px solid #34d399;box-shadow:0 12px 32px #000c}.nav-banner.show{display:block}
.nav-waze-row{display:flex;align-items:center;gap:14px}
.nav-turn-icon{font-size:36px;font-weight:900;line-height:1}
.nav-turn-text{flex:1}
.nav-small{font-size:11px;font-weight:700;color:#a7f3d0;text-transform:uppercase;letter-spacing:1px}
.nav-instruction{font-size:20px;font-weight:900;margin-top:2px;color:#fff}
.nav-next{font-size:12px;color:#d1fae5;margin-top:4px}
.nav-speedo{background:#000a;border:2px solid #38bdf8;border-radius:50%;width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}
.nav-speedo span{font-size:8px;color:#94a3b8}

.user-marker{width:24px;height:24px;border-radius:50%;background:#0284c7;border:3px solid #fff;box-shadow:0 0 0 6px rgba(2,132,199,0.4),0 4px 12px #000a;position:relative}
.user-marker::after{content:'';position:absolute;top:-8px;left:7px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid #fff}
.fuel-marker{width:30px;height:30px;border-radius:50%;background:#0ea5e9;border:2px solid #fff;box-shadow:0 3px 10px #0008;display:flex;align-items:center;justify-content:center;font-size:15px}
.fuel-marker.gnv{background:#16a34a}
.community-label{font-size:10px;font-weight:900;color:#fee2e2;background:#991b1bee;padding:3px 7px;border-radius:6px;border:1px solid #f87171cc;white-space:nowrap;box-shadow:0 2px 6px #0008}
.community-label.warning{color:#fef3c7;background:#92400eee;border-color:#fbbfaa}

.popup{font-size:12px;line-height:1.4;min-width:190px}.popup h3{font-size:14px;margin-bottom:5px}.muted{color:#94a3b8}.popup-actions{display:flex;gap:6px;margin-top:9px}.popup-actions a{flex:1;text-align:center;text-decoration:none;padding:7px;border-radius:8px;font-size:10px;font-weight:900;color:#fff;background:#166534}.popup-actions a.report{background:#991b1b}

.toast{position:fixed;left:50%;bottom:145px;transform:translate(-50%,20px);z-index:100;opacity:0;pointer-events:none;background:#111827;border:1px solid #38bdf8;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:700;max-width:90vw;text-align:center;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}

.modal{display:none;position:fixed;inset:0;z-index:90;background:#0009;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;background:#07131f;border-radius:22px 22px 0 0;padding:18px;border-top:1px solid #334155}.sheet h2{font-size:18px;margin-bottom:8px}.sheet p{font-size:12px;color:#94a3b8;line-height:1.45;margin-bottom:14px}.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sheet-grid button{border:1px solid #334155;border-radius:13px;padding:12px;background:#0b1b2a;color:#fff;text-align:left;font-weight:800;cursor:pointer}.sheet-close{width:100%;border:0;border-radius:12px;padding:12px;background:#1e293b;color:#fff;font-weight:900;margin-top:12px;cursor:pointer}

@media(min-width:700px){
.topbar{left:20px;right:auto;width:460px}.route-panel{left:20px;right:auto;width:430px}.bottom-actions{left:auto;right:20px;width:430px}.nav-banner{left:20px;right:auto;width:560px}

</style>
</head>

<body>
<div id="map"></div>

<div class="topbar">
  <div class="appbar">
    <div class="brand">🛡️ RADAR <span>SEGURO RJ PRO</span></div>
    <div class="badges">
      <span class="badge" id="themeBadge">AUTO</span>
      <span class="badge">ANP</span>
      <span id="gpsBadge" class="badge off">GPS...</span>
    </div>
  </div>

  <div class="search">
    <input id="destInput" type="search" placeholder="Rua, número, bairro ou local..." autocomplete="off">
    <button class="clear" id="clearBtn">✕</button>
    <button id="searchBtn">IR</button>
    <div id="suggest" class="suggest"></div>
  </div>

  <div class="chips">
    <button class="chip active" id="fuelChip">⛽ Postos</button>
    <button class="chip active" id="communityChip">🟥 Zonas de Risco</button>
    <button class="chip" id="themeChip">🌓 Tema: Auto</button>
    <button class="chip" id="satChip">🛰️ Satélite</button>
  </div>
</div>

<div class="nav-banner" id="navBanner">
  <div class="nav-waze-row">
    <div class="nav-turn-icon" id="navIcon">⬆️</div>
    <div class="nav-turn-text">
      <div class="nav-small" id="navAlertStatus">NAVEGAÇÃO ATIVA</div>
      <div class="nav-instruction" id="navInstruction">Siga pela rota destacada</div>
      <div class="nav-next" id="navNext">Calculando manobra...</div>
    </div>
    <div class="nav-speedo"><span id="speedVal">0</span><span>km/h</span></div>
  </div>
</div>

<div class="side">
  <button class="locate" id="locateBtn" title="Onde estou">◎</button>
  <button id="northBtn" title="Norte">N</button>
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="layersBtn">☷</button>
</div>

<div class="route-panel" id="routePanel">
  <div class="route-head">
    <div class="route-dest" id="routeDest">Destino</div>
    <button class="close-route" id="closeRoute">✕</button>
  </div>
  <div class="route-main">
    <div class="route-time" id="routeTime">-- min</div>
    <div class="route-dist" id="routeDist">-- km</div>
  </div>
  <div class="route-options" id="routeOptions"></div>
  <div class="route-buttons">
    <button class="start" id="startNav">▶ Iniciar estilo Waze</button>
    <button class="external" id="openMaps">Google Maps</button>
    <button class="external" id="openWaze">Waze</button>
    <button class="external" id="stopNav">Parar</button>
  </div>
</div>

<div class="bottom-actions">
  <button class="action danger" id="reportBtn">🚨 Denunciar</button>
  <button class="action primary" id="postosBtn">⛽ Postos</button>
  <button class="action anp" id="anpBtn">🏛️ ANP</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="layersModal">
  <div class="sheet">
    <h2>Camadas e Visualização</h2>
    <p>O Radar Seguro monitora zonas de conflito armado, favelas e áreas sob vigilância de Santa Cruz a Paraty, além de integrar dados de postos ANP.</p>
    <div class="sheet-grid">
      <button id="modalTheme">🌓 Alternar Tema (Claro/Escuro/Auto)</button>
      <button id="modalCommunity">🟥 Zonas de Risco</button>
      <button id="modalFuel">⛽ Postos</button>
      <button id="modalSatellite">🛰️ Satélite</button>
      <button id="modalLocate">📍 Minha Posição</button>
      <button id="modalReport">🚨 Denúncia ANP</button>
    </div>
    <button class="sheet-close" id="closeLayers">Fechar</button>
  </div>
</div>

  return [
    [+(lon - rX).toFixed(5), +(lat - rY).toFixed(5)],

function distanceKm(a,b){
const R=6371,lat1=a[1]*Math.PI/180,lat2=b[1]*Math.PI/180;
const dLat=(b[1]-a[1])*Math.PI/180,dLon=(b[0]-a[0])*Math.PI/180;
const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
return 2*R*Math.asin(Math.sqrt(h));
}

async function loadFuelStations(force=false){

const center=userPos||map.getCenter().toArray(),now=Date.now();

isFuelLoading=true;
lastFuelLoad=now;lastFuelCenter=center;

const q=`[out:json][timeout:20];(node["amenity"="fuel"](around:7000,${center[1]},${center[0]});way["amenity"="fuel"](around:7000,${center[1]},${center[0]}););out center tags;`;
try{
const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
if(!r.ok)throw Error('Overpass');
const data=await r.json();renderFuel(data.elements||[]);
}catch(e){console.warn(e);if(!fuelMarkers.length)toast('Postos indisponíveis no momento.')}
finally{isFuelLoading=false}
}

function normalizeQuery(q){

if(!/rio de janeiro|rj|brasil|itaguaí|mangaratiba|angra|paraty/i.test(q))q+=', RJ, Brasil';
return q;
}
function nomText(r){
const a=r.address||{};
return [r.name,a.road,a.house_number,a.suburb,a.city||a.town||a.municipality,a.state].filter(Boolean).join(', ')||r.display_name;
}

return [p.name,p.street,p.housenumber,p.district||p.suburb,p.city,p.state].filter(Boolean).join(', ');
}
async function nominatim(q){
const p=new URLSearchParams({format:'jsonv2',addressdetails:'1',limit:'8',countrycodes:'br',bounded:'1',viewbox:'-44.85,-22.60,-43.00,-23.40',q});
const r=await fetch('https://nominatim.openstreetmap.org/search?'+p,{headers:{'Accept-Language':'pt-BR,pt;q=.9'},signal:geocodeAbort.signal});
if(!r.ok)throw Error('Nominatim');
return r.json();
}
async function photon(q){
const c=userPos||map.getCenter().toArray();
const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lat=${c[1]}&lon=${c[0]}&lang=pt`,{signal:geocodeAbort.signal});
if(!r.ok)throw Error('Photon');
const j=await r.json();
return (j.features||[]).map(f=>({lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],display_name:photonText(f)}));
}
async function geocode(q){
const wait=Math.max(0,1100-(Date.now()-lastGeocodeAt));if(wait)await new Promise(r=>setTimeout(r,wait));
lastGeocodeAt=Date.now();geocodeAbort?.abort();geocodeAbort=new AbortController();
q=normalizeQuery(q);
try{
const r=await nominatim(q);
if(r.length)return r.map(x=>({lat:x.lat,lon:x.lon,display_name:nomText(x)}));
}catch(e){if(e.name==='AbortError')throw e;}
return photon(q);
}

function allSteps(){return(routeData?.legs||[]).flatMap(l=>l.steps||[])}
function stepIcon(s){
  const m=s.maneuver||{};
  if(m.type==='arrive') return '🏁';
  if(m.modifier==='left'||m.modifier==='sharp left') return '⬅️';
  if(m.modifier==='slight left') return '↖️';
  if(m.modifier==='right'||m.modifier==='sharp right') return '➡️';
  if(m.modifier==='slight right') return '↗️';
  if(m.type==='roundabout'||m.type==='rotary') return '🔄';
  return '⬆️';
}
function stepText(s){
const m=s.maneuver||{},road=s.name?` na ${s.name}`:'';
if(m.type==='arrive')return'Destino alcançado';
if(m.type==='depart')return'Siga pela via'+road;
if(m.type==='roundabout'||m.type==='rotary')return'Entre na rotatória'+road;
if(m.type==='merge')return'Acesse a pista'+road;
if(m.type==='fork')return`Mantenha-se ${m.modifier==='left'?'à esquerda':'à direita'}${road}`;
if(m.type==='turn')return`Vire ${m.modifier==='left'?'à esquerda':m.modifier==='right'?'à direita':'em frente'}${road}`;
return'Siga em frente'+road;
}
function updateNavigation(){
if(!navActive||!userPos||!routeData)return;
const steps=allSteps();if(!steps.length)return;
let best=0,bestDist=Infinity;
steps.forEach((s,i)=>{const c=s.maneuver?.location;if(!c)return;const d=distanceKm(userPos,c);if(d<bestDist){bestDist=d;best=i}});
currentStep=best;
const s=steps[currentStep],next=steps[currentStep+1];
document.getElementById('navIcon').textContent=stepIcon(s);
document.getElementById('navInstruction').textContent=stepText(s);
document.getElementById('navNext').textContent=next?'Depois: '+stepText(next):'Siga até o destino final';
if(currentStep!==lastAnnouncedStep&&bestDist<.09){
lastAnnouncedStep=currentStep;
if('speechSynthesis'in window){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(stepText(s));u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
}
}

document.getElementById('reportBtn').onclick=()=>openExternal(ANP_REPORT);
document.getElementById('anpBtn').onclick=()=>openExternal(ANP_APP);
document.getElementById('postosBtn').onclick=()=>{if(!fuelVisible)toggleFuel();locate();loadFuelStations(true)};

document.getElementById('layersBtn').onclick=()=>document.getElementById('layersModal').classList.add('show');
document.getElementById('closeLayers').onclick=()=>document.getElementById('layersModal').classList.remove('show');
document.getElementById('modalFuel').onclick=toggleFuel;
document.getElementById('modalCommunity').onclick=toggleCommunity;
document.getElementById('modalSatellite').onclick=toggleSatellite;
document.getElementById('modalLocate').onclick=()=>{document.getElementById('layersModal').classList.remove('show');locate()};
document.getElementById('modalReport').onclick=()=>openExternal(ANP_REPORT);

document.getElementById('searchBtn').onclick=iniciarRota;
window.addEventListener('pagehide',()=>{if(watchId!=null)navigator.geolocation.clearWatch(watchId);wakeLock?.release?.()});
</script>
