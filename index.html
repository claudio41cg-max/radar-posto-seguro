<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radar Seguro RJ Pro - Navegação Ativa</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0f19; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #0f172a; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 1000; border-bottom: 1px solid rgba(56, 189, 248, 0.3); }
    .brand h1 { font-size: 0.95rem; font-weight: 800; color: #38bdf8; }
    #map { flex: 1; width: 100%; z-index: 1; }

    /* Barra Superior de Busca */
    .search-wrapper { position: absolute; top: 56px; left: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 4px; }
    .search-bar { display: flex; background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
    .nav-input { flex: 1; padding: 12px 14px; border: none; background: transparent; color: #fff; font-size: 0.9rem; outline: none; }
    .btn-go { background: #0284c7; color: #fff; border: none; padding: 0 18px; font-weight: 800; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    /* Dropdown de Sugestões */
    #searchDropdown { background: #0f172a; border: 1px solid #334155; border-radius: 10px; max-height: 200px; overflow-y: auto; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .suggestion-item { padding: 12px 14px; border-bottom: 1px solid #1e293b; font-size: 0.82rem; color: #e2e8f0; cursor: pointer; }

    /* Botões Flutuantes Direita */
    .right-controls { position: absolute; top: 120px; right: 10px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
    .fab-btn { width: 46px; height: 46px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); background: #0f172a; color: #f8fafc; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.6); }
    .fab-btn.active { background: #0284c7; }
    .fab-btn.danger-active { background: #dc2626; }

    /* Painel de Rota */
    #navInfoCard { position: absolute; top: 120px; left: 10px; right: 64px; background: #0f172a; border-left: 4px solid #38bdf8; border-radius: 12px; padding: 10px 14px; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.7); z-index: 999; }
    .btn-start-drive { background: #22c55e; color: #0b0f19; font-weight: 800; padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; margin-top: 8px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.85rem; }

    /* Placas Comunidades */
    .community-tag { background: #090d16; border: 2px solid; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 900; text-transform: uppercase; white-space: nowrap; display: inline-block; text-align: center; }
    .tag-vermelha { border-color: #ef4444; color: #fca5a5; }
    .tag-laranja { border-color: #f97316; color: #fdba74; }

    /* Alerta de Perigo */
    #alertBanner { position: absolute; bottom: 20px; left: 10px; right: 10px; background: #b91c1c; color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(185, 28, 28, 0.8); z-index: 1000; display: none; border: 1px solid #f87171; }

    /* Street View Container */
    #streetViewContainer { position: absolute; bottom: 15px; left: 10px; right: 10px; height: 42%; background: #0f172a; border-radius: 16px; border: 2px solid #38bdf8; z-index: 1001; display: none; overflow: hidden; }
    #streetViewFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header><div class="brand"><h1>⛽ RADAR SEGURO RJ PRO</h1></div></header>

  <div class="search-wrapper">
    <div class="search-bar">
      <input type="text" id="destInput" class="nav-input" placeholder="Endereço, rua ou bairro..." oninput="buscarSugestoes(this.value)">
      <button class="btn-go" onclick="executarBuscaDireta()">🧭 IR</button>
    </div>
    <div id="searchDropdown"></div>
  </div>

  <div class="right-controls">
    <button class="fab-btn" id="btnTransport" onclick="toggleTransportMenu()">🚗</button>
    <button class="fab-btn" id="btnGps" onclick="toggleGPS()">🛰️</button>
    <button class="fab-btn danger-active" id="btnLayerAreas" onclick="toggleAreas()">⚠️</button>
    <button class="fab-btn" id="btnMapStyle" onclick="alternarSat()">🗺️</button>
    <button class="fab-btn" onclick="abrirModalAdd()">➕</button>
  </div>

  <div id="navInfoCard">
    <div class="nav-stats">
      <div><span id="routeTime" style="font-weight:800; color:#38bdf8;">-- min</span> <span id="routeDist" style="font-size:0.8rem; color:#94a3b8;">-- km</span></div>
      <button style="background: #ef4444; color: white; padding: 5px 10px; border-radius:6px; border:none;" onclick="cancelarRota()">✖</button>
    </div>
    <button class="btn-start-drive" id="btnDrive" onclick="iniciarMovimentoNavegacao()">🚀 INICIAR NAVEGAÇÃO</button>
  </div>

  <div id="map"></div>

  <div id="streetViewContainer"><iframe id="streetViewFrame" src=""></iframe></div>
  <div id="alertBanner"></div>

  <!-- Incluir Modais de Cadastro aqui conforme versão anterior -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-22.9068, -43.35], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    let currentCoords = null;
    let gpsWatchId = null;
    let userMarker = null;

    // GPS REAL e OBRIGATÓRIO: O app só desenha a rota a partir daqui
    function iniciarRastreamento() {
      if (navigator.geolocation) {
        gpsWatchId = navigator.geolocation.watchPosition((pos) => {
          currentCoords = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
          if (!userMarker) userMarker = L.circleMarker([currentCoords.latitude, currentCoords.longitude], {radius: 8, color: '#38bdf8'}).addTo(map);
          else userMarker.setLatLng([currentCoords.latitude, currentCoords.longitude]);
        }, null, { enableHighAccuracy: true });
      }
    }

    async function executarBuscaDireta() {
      const termo = document.getElementById('destInput').value;
      if (!termo) return alert("Digite um destino!");
      
      // Força a posição atual antes de traçar a rota
      if (!currentCoords) {
        alert("Aguardando sinal GPS...");
        return;
      }
      
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termo + ', Rio de Janeiro')}&limit=1`);
      const data = await res.json();
      
      if (data.length > 0) {
        const dest = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        iniciarRotaComposicaoReal(dest.lat, dest.lng);
      }
    }

    async function iniciarRotaComposicaoReal(latDest, lngDest) {
        // Usa currentCoords que já foi setado pelo iniciarRastreamento
        const url = `https://router.project-osrm.org/route/v1/driving/${currentCoords.longitude},${currentCoords.latitude};${lngDest},${latDest}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const json = await res.json();
        if (json.routes) {
            const coords = json.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            L.polyline(coords, {color: '#38bdf8', weight: 6}).addTo(map);
            map.fitBounds(coords);
            document.getElementById('navInfoCard').style.display = 'block';
        }
    }

    window.onload = iniciarRastreamento;
  </script>
</body>
</html>
