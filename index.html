<script>
// ================== SEU JAVASCRIPT COMPLETO AQUI ==================
// (Incluindo a lista estática de comunidades, mas com as funções de busca automática)

// ================================================================
// BUSCA AUTOMÁTICA DE COMUNIDADES (OVERSPASS) - NOVO
// ================================================================
let communityData = [...communities]; // inicia com a lista estática

async function buscarComunidadesOverpass() {
  toast('Buscando comunidades no OpenStreetMap...', 'spinner fa-pulse', 4000);
  try {
    const bbox = '-44.2,-23.1,-43.0,-22.6';
    const query = `
      [out:json][timeout:45];
      (
        relation["place"~"(neighbourhood|village|quarter|suburb)"]["informal"="yes"](${bbox});
        way["place"~"(neighbourhood|village|quarter|suburb)"]["informal"="yes"](${bbox});
        relation["landuse"="residential"]["informal"="yes"](${bbox});
        way["landuse"="residential"]["informal"="yes"](${bbox});
        relation["place"~"(neighbourhood|village|quarter|suburb)"]["slum"="yes"](${bbox});
        way["place"~"(neighbourhood|village|quarter|suburb)"]["slum"="yes"](${bbox});
        relation["name"~"^(?i)(favela|comunidade|vila|conjunto|jardim|parque|bairro|sítio|campo)"]["place"="neighbourhood"](${bbox});
        way["name"~"^(?i)(favela|comunidade|vila|conjunto|jardim|parque|bairro|sítio|campo)"]["place"="neighbourhood"](${bbox});
      );
      out body;
      >;
      out skel qt;
    `;
    const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
    const response = await fetch(url);
    if (!response.ok) throw new Error('Erro na busca Overpass');
    const data = await response.json();
    const novasComunidades = processarOverpassData(data);
    if (novasComunidades.length === 0) {
      toast('Nenhuma comunidade encontrada. Usando lista estática.', 'info-circle', 4000);
      return false;
    }
    atualizarComunidades(novasComunidades);
    toast(`✅ ${novasComunidades.length} comunidades carregadas automaticamente!`, 'check-circle', 4000);
    return true;
  } catch (e) {
    console.warn('Falha na busca Overpass:', e);
    toast('Falha ao buscar comunidades. Usando lista estática.', 'exclamation-circle', 5000);
    return false;
  }
}

function processarOverpassData(data) {
  const elements = data.elements || [];
  const comunidades = [];
  const nodes = {};
  elements.forEach(el => { if (el.type === 'node') nodes[el.id] = { lat: el.lat, lon: el.lon }; });
  elements.forEach(el => {
    if (el.type !== 'relation' && el.type !== 'way') return;
    if (!el.tags || !el.tags.name) return;
    const nome = el.tags.name;
    if (comunidades.some(c => c.name === nome)) return;
    let coords = [];
    if (el.type === 'way' && el.geometry) {
      coords = el.geometry.map(g => [g.lon, g.lat]);
    } else if (el.type === 'relation' && el.members) {
      const members = el.members.filter(m => m.type === 'way');
      if (members.length > 0) {
        const wayId = members[0].ref;
        const wayEl = elements.find(e => e.id === wayId && e.type === 'way');
        if (wayEl && wayEl.geometry) {
          coords = wayEl.geometry.map(g => [g.lon, g.lat]);
        }
      }
    }
    if (coords.length === 0) {
      if (el.center) {
        coords = [[el.center.lon, el.center.lat]];
      } else if (el.bounds) {
        const minLon = el.bounds.minlon, maxLon = el.bounds.maxlon;
        const minLat = el.bounds.minlat, maxLat = el.bounds.maxlat;
        const centerLon = (minLon + maxLon) / 2;
        const centerLat = (minLat + maxLat) / 2;
        coords = [[centerLon, centerLat]];
      }
    }
    if (coords.length === 0) return;
    let center = coords[0];
    if (coords.length > 2) {
      let sumLon = 0, sumLat = 0;
      coords.forEach(p => { sumLon += p[0]; sumLat += p[1]; });
      center = [sumLon / coords.length, sumLat / coords.length];
    }
    let raio = 0.35;
    if (coords.length > 2) {
      let totalDist = 0;
      coords.forEach(p => { const d = distanceKm(center, p); totalDist += d; });
      const avgDist = totalDist / coords.length;
      raio = Math.max(0.2, Math.min(0.8, avgDist * 1.2));
    }
    const major = coords.length > 10 || raio > 0.5;
    comunidades.push({
      name: nome,
      type: 'conflito',
      major: major,
      coords: makePerimeter(center[0], center[1], raio),
      source: 'Overpass'
    });
  });
  return comunidades;
}

function atualizarComunidades(novaLista) {
  communityData = novaLista;
  addCommunityLayers();
  map.setLayoutProperty('community-fill','visibility', communityVisible ? 'visible' : 'none');
  map.setLayoutProperty('community-labels','visibility', communityVisible ? 'visible' : 'none');
}

// Modifique addCommunityLayers para usar communityData
function addCommunityLayers() {
  if (!map.isStyleLoaded()) { map.once('style.load', addCommunityLayers); return; }
  if (map.getLayer('community-fill')) map.removeLayer('community-fill');
  if (map.getLayer('community-labels')) map.removeLayer('community-labels');
  if (map.getSource('community-source')) map.removeSource('community-source');

  const geo = {
    type: 'FeatureCollection',
    features: communityData.map(c => ({
      type: 'Feature',
      properties: { name: c.name, type: c.type, major: c.major },
      geometry: { type: 'Polygon', coordinates: [c.coords] }
    }))
  };
  map.addSource('community-source', { type: 'geojson', data: geo });
  map.addLayer({
    id: 'community-fill',
    type: 'fill',
    source: 'community-source',
    minzoom: 10,
    paint: {
      'fill-color': ['case', ['==', ['get', 'type'], 'conflito'], '#dc2626', '#d97706'],
      'fill-opacity': [
        'interpolate', ['linear'], ['zoom'],
        10, 0.0,
        11, 0.08,
        12, 0.13,
        14, 0.18,
        16, 0.24
      ]
    }
  });
  map.addLayer({
    id: 'community-labels',
    type: 'symbol',
    source: 'community-source',
    minzoom: 10.5,
    layout: {
      'text-field': ['concat', '⚠ ', ['get', 'name']],
      'text-font': FONT_STACK,
      'text-size': [
        'interpolate', ['linear'], ['zoom'],
        10.5, 8,
        13, 10,
        16, 13
      ],
      'text-allow-overlap': false,
      'text-ignore-placement': false,
      'text-anchor': 'center',
      'symbol-sort-key': ['case', ['==', ['get','major'], true], 0, 1]
    },
    paint: {
      'text-color': '#fee2e2',
      'text-halo-color': '#450a0a',
      'text-halo-width': 1.5,
      'text-opacity': [
        'interpolate', ['linear'], ['zoom'],
        10.5, 0.0,
        11, 0.85,
        12.5, 1.0
      ]
    }
  });
  map.setLayoutProperty('community-fill','visibility', communityVisible ? 'visible' : 'none');
  map.setLayoutProperty('community-labels','visibility', communityVisible ? 'visible' : 'none');
}

// No evento 'load' do mapa, adicione a busca automática
map.on('load', () => {
  if (map.isStyleLoaded()) addCommunityLayers();
  else map.once('style.load', addCommunityLayers);
  startGPSWatch();
  carregarPostosIniciais();
  setTimeout(async () => {
    const sucesso = await buscarComunidadesOverpass();
    if (!sucesso) {
      // Fallback: usa a lista estática
      addCommunityLayers();
    }
  }, 3000);
});

// Botão para buscar manualmente
document.getElementById('btnBuscarComunidades').onclick = async () => {
  document.getElementById('layersModal').classList.remove('show');
  await buscarComunidadesOverpass();
};

</script>
