name = "radar-seguro-rj-ai"
main = "src/index.js"
compatibility_date = "2026-08-28"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://claudio41cg-max.github.io"
GEMINI_MODEL = "gemini-2.5-flash-lite"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "41001"

  [ratelimits.simple]
  limit = 20
  period = 60

[observability]
enabled = true
head_sampling_rate = 0.1
