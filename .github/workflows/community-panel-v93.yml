name: Radar v93 - painel fiel e toque geometrico
on:
  push:
    paths: ['.github/workflows/community-panel-v93.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ativar v93
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<meta name="radar-build" content="[^"]+">','<meta name="radar-build" content="93-reference-community-panel">',s,count=1)
          old='<script src="./community-panel-v90.js?v=91"></script>'
          new='<script src="./community-panel-v93.js?v=93"></script>'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: s=s.replace('</body>',new+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "v93: ativar painel visual e toque geometrico"
          git push