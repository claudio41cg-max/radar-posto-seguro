name: v139 externalize routing

on:
  push:
    paths:
      - '.github/workflows/v139-externalize-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tirar motor de rota do index
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start_marker = "/* =========================================================\n   TOMTOM\n========================================================= */"
          end_marker = "/* =========================================================\n   DESENHO ROTA\n========================================================= */"

          start = s.find(start_marker)
          end = s.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Marcadores TOMTOM/DESENHO ROTA nao encontrados na ordem esperada')

          body_start = start + len(start_marker)
          body = s[body_start:end]
          required = [
              'async fetchTomTomRoute(a,b)',
              'tomTomModifier(type)',
              'async fetchOSRMRoute(a,b)',
              'async getRoute(a,b)',
              'async calculateRoute()'
          ]
          missing = [x for x in required if x not in body]
          if missing:
              raise SystemExit('Bloco de rota inesperado; faltando: ' + ', '.join(missing))

          module = """/* Radar Seguro RJ PRO v139 — motor de rota extraido do index.html */\nwindow.RadarRoutingV139 = {""" + body + "\n};\n"
          Path('routing-engine-v139.js').write_text(module, encoding='utf-8')

          replacement = "/* =========================================================\n   MOTOR DE ROTA — externalizado em routing-engine-v139.js\n========================================================= */\n\n"
          s = s[:start] + replacement + s[end:]

          traffic_anchor = 'const TrafficAssistantV40='
          pos = s.find(traffic_anchor)
          if pos < 0:
              raise SystemExit('Ponto seguro apos o fechamento do App nao encontrado')

          assign = "Object.assign(App, window.RadarRoutingV139 || {});\n\n"
          if assign not in s:
              s = s[:pos] + assign + s[pos:]

          search_tag = '<script src="./search-module-v138.js?v=138"></script>'
          route_tag = '<script src="./routing-engine-v139.js?v=139"></script>'
          if search_tag in s and route_tag not in s:
              s = s.replace(search_tag, search_tag + '\n' + route_tag, 1)
          elif route_tag not in s:
              app_marker = '/* =========================================================\n   APP\n========================================================= */'
              app_pos = s.find(app_marker)
              if app_pos < 0:
                  raise SystemExit('Ancora APP nao encontrada para carregar modulo de rota')
              script_open = s.rfind('<script>', 0, app_pos)
              if script_open < 0:
                  raise SystemExit('Script do APP nao encontrado')
              s = s[:script_open] + route_tag + '\n' + s[script_open:]

          p.write_text(s, encoding='utf-8')

      - name: Validar alteracao
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          m = Path('routing-engine-v139.js').read_text(encoding='utf-8')
          assert 'routing-engine-v139.js?v=139' in s
          assert 'Object.assign(App, window.RadarRoutingV139 || {});' in s
          for needle in ['async fetchTomTomRoute(a,b)','async fetchOSRMRoute(a,b)','async getRoute(a,b)','async calculateRoute()']:
              assert needle not in s
              assert needle in m
          assert 'drawRoute(route,fit=true)' in s
          assert 'const App = {' in s
          print('v139 validada')

      - name: Commit v139
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html routing-engine-v139.js
          git diff --cached --quiet && exit 0
          git commit -m "v139: extrair motor de rota do index"
          git push
