name: Importar mais três comunidades da Zona Sul

on:
  push:
    paths:
      - ".github/workflows/import-zona-sul-mais-tres.yml"

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar leitor geográfico
        run: python -m pip install --disable-pip-version-check pyshp shapely pyproj

      - name: Extrair somente as três comunidades
        run: |
          python - <<'PY'
          import glob
          import json
          import math
          import os
          import re
          import unicodedata
          import urllib.request
          import zipfile
          from datetime import datetime, timezone

          import shapefile
          from pyproj import CRS, Transformer
          from shapely.geometry import shape, mapping, MultiPolygon
          from shapely.ops import transform, unary_union

          source_url = (
              "https://data.mendeley.com/public-files/datasets/x959s4g493/"
              "files/5c0f5e4d-ef6f-48a0-b7d4-44aeb555ae50/file_downloaded"
          )
          archive = "/tmp/ibge-favelas.zip"
          extracted = "/tmp/ibge-favelas"

          request = urllib.request.Request(
              source_url,
              headers={"User-Agent": "Radar-Seguro-RJ/1.0 community-boundary-import"}
          )
          with urllib.request.urlopen(request, timeout=120) as response, open(archive, "wb") as out:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  out.write(chunk)

          if os.path.getsize(archive) < 1_000_000:
              raise RuntimeError("Arquivo geográfico menor do que o esperado.")

          with zipfile.ZipFile(archive) as zf:
              zf.extractall(extracted)

          shapefiles = glob.glob(extracted + "/**/*.shp", recursive=True)
          if not shapefiles:
              raise RuntimeError("Nenhum shapefile encontrado.")
          shp_path = max(shapefiles, key=os.path.getsize)

          def normalize(value):
              value = unicodedata.normalize("NFD", str(value or ""))
              value = "".join(ch for ch in value if unicodedata.category(ch) != "Mn")
              value = re.sub(r"[^A-Za-z0-9]+", " ", value).strip().upper()
              return value

          reader = shapefile.Reader(shp_path, encoding="utf-8")
          field_names = [field[0] for field in reader.fields[1:]]
          field_map = {normalize(name): name for name in field_names}

          def find_field(*candidates):
              for candidate in candidates:
                  key = normalize(candidate)
                  if key in field_map:
                      return field_map[key]
              raise RuntimeError(
                  "Campo ausente: " + ", ".join(candidates) +
                  ". Disponíveis: " + ", ".join(field_names)
              )

          favela_field = find_field("NM_FCU", "NOME_FCU", "NOME")
          city_field = find_field("NM_MUN", "MUNICIPIO", "MUNICÍPIO")

          prj_candidates = glob.glob(os.path.splitext(shp_path)[0] + ".prj")
          source_crs = CRS.from_epsg(4674)
          if prj_candidates:
              with open(prj_candidates[0], encoding="utf-8", errors="ignore") as handle:
                  wkt = handle.read().strip()
              if wkt:
                  source_crs = CRS.from_wkt(wkt)

          transformer = Transformer.from_crs(source_crs, CRS.from_epsg(4326), always_xy=True)
          transform_needed = source_crs.to_epsg() not in (4326, 4674)

          preferred = {
              "Tavares Bastos": (-43.18400, -22.93200),
              "Morro Azul": (-43.17800, -22.93600),
              "Pereira da Silva": (-43.18900, -22.94150),
          }

          def group_for(name):
              clean = normalize(name)
              if "TAVARES BASTOS" in clean:
                  return "Tavares Bastos"
              if "MORRO AZUL" in clean or "NOSSA SENHORA DE LOURDES" in clean:
                  return "Morro Azul"
              if "PEREIRA DA SILVA" in clean or "PEREIRAO" in clean:
                  return "Pereira da Silva"
              return None

          def haversine_km(a, b):
              lon1, lat1 = map(math.radians, a)
              lon2, lat2 = map(math.radians, b)
              dlon = lon2 - lon1
              dlat = lat2 - lat1
              value = (
                  math.sin(dlat / 2) ** 2 +
                  math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2
              )
              return 6371.0 * 2 * math.asin(math.sqrt(value))

          grouped = {name: [] for name in preferred}
          audit_names = {name: [] for name in preferred}

          for shape_record in reader.iterShapeRecords():
              properties = dict(zip(field_names, list(shape_record.record)))
              if normalize(properties.get(city_field)) != "RIO DE JANEIRO":
                  continue
              source_name = str(properties.get(favela_field) or "").strip()
              target = group_for(source_name)
              if not target:
                  continue
              geometry = shape(shape_record.shape.__geo_interface__)
              if transform_needed:
                  geometry = transform(transformer.transform, geometry)
              if geometry.is_empty:
                  continue
              point = geometry.representative_point()
              distance = haversine_km((point.x, point.y), preferred[target])
              if distance > 3.0:
                  continue
              grouped[target].append(geometry)
              audit_names[target].append(source_name)

          features = []
          for target, geometries in grouped.items():
              if not geometries:
                  raise RuntimeError("Nenhum limite localizado para " + target)
              merged = unary_union(geometries)
              if merged.geom_type == "GeometryCollection":
                  polygons = [g for g in merged.geoms if g.geom_type == "Polygon"]
                  merged = MultiPolygon(polygons)
              if merged.geom_type not in ("Polygon", "MultiPolygon"):
                  raise RuntimeError("Geometria inesperada para " + target + ": " + merged.geom_type)
              merged = merged.simplify(0.000006, preserve_topology=True)
              point = merged.representative_point()
              if not merged.covers(point):
                  raise RuntimeError("Centro fora do limite para " + target)

              geometry_json = mapping(merged)
              def round_coords(value):
                  if isinstance(value, (list, tuple)):
                      return [round_coords(item) for item in value]
                  return round(float(value), 6)
              geometry_json["coordinates"] = round_coords(geometry_json["coordinates"])

              features.append({
                  "type": "Feature",
                  "properties": {
                      "name": target,
                      "center": [round(point.x, 6), round(point.y, 6)],
                      "sourceNames": sorted(set(audit_names[target])),
                      "source": "Polígonos oficiais de FCU do Censo 2022/IBGE",
                  },
                  "geometry": geometry_json,
              })

          output = {
              "type": "FeatureCollection",
              "name": "Mais três comunidades da Zona Sul do Rio de Janeiro",
              "source": "The State of Brazilian Favelas V1, derivado dos polígonos oficiais do Censo 2022/IBGE",
              "sourceUrl": "https://data.mendeley.com/datasets/x959s4g493/1",
              "sourceDOI": "10.17632/x959s4g493.1",
              "license": "CC BY 4.0",
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "features": features,
          }

          os.makedirs("data", exist_ok=True)
          with open("data/ibge-zona-sul-mais-tres.geojson", "w", encoding="utf-8") as handle:
              json.dump(output, handle, ensure_ascii=False, separators=(",", ":"))
              handle.write("\n")

          print(json.dumps({
              "shapefile": os.path.basename(shp_path),
              "crs": source_crs.to_string(),
              "features": [
                  {
                      "name": feature["properties"]["name"],
                      "center": feature["properties"]["center"],
                      "sourceNames": feature["properties"]["sourceNames"],
                      "geometryType": feature["geometry"]["type"],
                  }
                  for feature in features
              ],
              "bytes": os.path.getsize("data/ibge-zona-sul-mais-tres.geojson"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Salvar os limites verificados
        run: |
          git config user.name "Radar Seguro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ibge-zona-sul-mais-tres.geojson
          git commit -m "Importa mais três comunidades da Zona Sul pelo IBGE"
          git push origin HEAD:main
