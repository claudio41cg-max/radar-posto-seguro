name: v107 centralize ai endpoint

on:
  push:
    paths:
      - '.github/workflows/config-ai-endpoint-v107.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralizar endpoint da IA sem alterar comportamento
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg=Path('app-config-v100.js')
          c=cfg.read_text(encoding='utf-8')
          if 'AI_ENDPOINT:' not in c:
              c=c.replace("  ANP_STATIONS_URL: './data/postos-anp-rio.json',", "  ANP_STATIONS_URL: './data/postos-anp-rio.json',\n  AI_ENDPOINT: 'https://radar-seguro-ia-rj.claudio41cg.workers.dev',", 1)
          cfg.write_text(c,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="  aiEndpoint:'https://radar-seguro-ia-rj.claudio41cg.workers.dev',"
          new="  aiEndpoint:RADAR_CONFIG.AI_ENDPOINT || 'https://radar-seguro-ia-rj.claudio41cg.workers.dev',"
          if old in s:
              s=s.replace(old,new,1)
          s=re.sub(r'<meta name="radar-build" content="[^"]+">','<meta name="radar-build" content="107-central-ai-endpoint">',s,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"radar-seguro-rj-v\d+","radar-seguro-rj-v107",w,count=1)
          w=re.sub(r"build:'\d+'","build:'107'",w)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit v107
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-config-v100.js index.html service-worker.js
          git commit -m "v107: centralizar endpoint da IA" || exit 0
          git push
