name: v140 externalize route drawing

on:
  push:
    paths:
      - '.github/workflows/v140-externalize-route-drawing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tirar desenho e resumo da rota do index
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start_marker = "/* =========================================================\n   DESENHO ROTA\n========================================================= */"
          end_marker = "/* =========================================================\n   FORA DA ROTA\n========================================================= */"

          start = s.find(start_marker)
          end = s.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Marcadores DESENHO ROTA/FORA DA ROTA nao encontrados na ordem esperada')

          body_start = start + len(start_marker)
          body = s[body_start:end]
          required = [
              'updateRemainingRouteLine()',
              'drawRoute(route,fit=true)',
              'updateRouteSummary()',
              'renderDestinationFlag()'
          ]
          missing = [x for x in required if x not in body]
          if missing:
              raise SystemExit('Bloco de desenho inesperado; faltando: ' + ', '.join(missing))

          module = """/* Radar Seguro RJ PRO v140 — desenho e resumo de rota extraidos do index.html */\nwindow.RadarRouteDrawingV140 = {""" + body + "\n};\n"
          Path('route-drawing-v140.js').write_text(module, encoding='utf-8')

          replacement = "/* =========================================================\n   DESENHO DA ROTA — externalizado em route-drawing-v140.js\n========================================================= */\n\n"
          s = s[:start] + replacement + s[end:]

          traffic_anchor = 'const TrafficAssistantV40='
          pos = s.find(traffic_anchor)
          if pos < 0:
              raise SystemExit('Ponto seguro apos o fechamento do App nao encontrado')

          assign = "Object.assign(App, window.RadarRouteDrawingV140 || {});\n\n"
          if assign not in s:
              s = s[:pos] + assign + s[pos:]

          routing_tag = '<script src="./routing-engine-v139.js?v=139"></script>'
          draw_tag = '<script src="./route-drawing-v140.js?v=140"></script>'
          if routing_tag in s and draw_tag not in s:
              s = s.replace(routing_tag, routing_tag + '\n' + draw_tag, 1)
          elif draw_tag not in s:
              app_marker = '/* =========================================================\n   APP\n========================================================= */'
              app_pos = s.find(app_marker)
              if app_pos < 0:
                  raise SystemExit('Ancora APP nao encontrada para carregar modulo de desenho')
              script_open = s.rfind('<script>', 0, app_pos)
              if script_open < 0:
                  raise SystemExit('Script do APP nao encontrado')
              s = s[:script_open] + draw_tag + '\n' + s[script_open:]

          p.write_text(s, encoding='utf-8')

      - name: Validar alteracao
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          m = Path('route-drawing-v140.js').read_text(encoding='utf-8')
          assert 'route-drawing-v140.js?v=140' in s
          assert 'Object.assign(App, window.RadarRouteDrawingV140 || {});' in s
          declarations = [
              '\n  updateRemainingRouteLine(){',
              '\n  drawRoute(route,fit=true){',
              '\n  updateRouteSummary(){',
              '\n  renderDestinationFlag(){'
          ]
          for needle in declarations:
              assert needle not in s
              assert needle in m
          assert '\n  checkOffRoute(match){' in s
          assert 'const App = {' in s
          print('v140 validada')

      - name: Commit v140
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html route-drawing-v140.js
          git diff --cached --quiet && exit 0
          git commit -m "v140: extrair desenho e resumo da rota do index"
          git push
