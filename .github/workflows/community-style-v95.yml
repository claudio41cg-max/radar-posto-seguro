name: Radar v95 - estilo cartografico de comunidades
on:
  push:
    paths: ['.github/workflows/community-style-v95.yml']
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ativar estilo v95
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<meta name="radar-build" content="[^"]+">','<meta name="radar-build" content="95-all-communities-cartographic">',s,count=1)
          tag='<script src="./community-map-style-v95.js?v=95"></script>'
          if tag not in s: s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "v95: estilo cartografico em todas as comunidades"
          git push