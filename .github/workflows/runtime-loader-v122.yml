name: Runtime loader v122
on:
  push:
    paths:
      - '.github/workflows/runtime-loader-v122.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar runtime direto para v122
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("window.RADAR_RUNTIME_BUILD='121';","window.RADAR_RUNTIME_BUILD='122';")
          s=s.replace('./route-traffic-v74.js?v=120','./route-traffic-v74.js?v=122')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v122
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v122: carregar diagnostico de transito direto no index" || exit 0
          git push
