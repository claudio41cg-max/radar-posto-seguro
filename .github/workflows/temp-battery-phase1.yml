name: Economia de bateria fase 1

on:
  push:
    paths:
      - .github/workflows/temp-battery-phase1.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar script
        run: node --check .github/scripts/temp-battery-phase1.js

      - name: Aplicar economia segura
        run: node .github/scripts/temp-battery-phase1.js

      - name: Confirmar escopo e publicar
        run: |
          test -n "$(git status --short index.html)"
          test -z "$(git status --short -- data/fogo-cruzado.json)"
          git config user.name "Radar Seguro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Reduz consumo de bateria sem perder precisão"
          git pull --rebase origin main
          git push origin HEAD:main
