name: v146 assistente natural
on:
  push:
    paths:
      - '.github/workflows/v146-assistente-natural.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar assistente natural
        run: python3 .github/scripts/v146_assistente_natural.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "v146: aceitar comandos de voz naturais"
          git push
