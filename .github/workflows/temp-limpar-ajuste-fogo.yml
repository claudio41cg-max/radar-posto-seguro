name: Limpar arquivos temporarios do ajuste

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-limpar-ajuste-fogo.yml'

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover somente arquivos temporarios desta tarefa
        shell: bash
        run: |
          git config user.name "Radar Seguro Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f             .github/scripts/temp-add3.js             .github/workflows/temp-3-comunidades-fogo-2dias.yml             .github/workflows/temp-3-comunidades-fogo-2dias-v2.yml             .github/workflows/temp-3-comunidades-fogo-2dias-v3.yml             .github/workflows/temp-3-comunidades-fogo-2dias-v4.yml             .github/workflows/temp-3-comunidades-fogo-2dias-v5.yml             .github/workflows/temp-reverter-poligonos-incorretos.yml             .github/workflows/temp-limpar-ajuste-fogo.yml
          git add -A
          git commit -m "Remover rotinas temporárias do ajuste"
          git push
