name: v115 activate route via
on:
  push:
    paths:
      - '.github/workflows/route-via-v115.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate v115 modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          tag='<script src="./route-via-v115.js?v=115"></script>'
          if tag not in s:
              anchor='<script src="./route-traffic-v74.js"></script>'
              if anchor in s: s=s.replace(anchor, tag+'\n'+anchor,1)
              else: s=s.replace('</body>',tag+'\n</body>',1)
          s=re.sub(r'<meta name="radar-build" content="[^"]+">','<meta name="radar-build" content="115-route-traffic-via">',s,1)
          p.write_text(s)
          sw=Path('service-worker.js'); w=sw.read_text()
          w=re.sub(r"radar-seguro-rj-v\d+","radar-seguro-rj-v115",w,1)
          w=re.sub(r"build:'\d+'","build:'115'",w)
          if "'./route-via-v115.js?v=115'" not in w:
              w=w.replace("'./route-traffic-v74.js'","'./route-via-v115.js?v=115','./route-traffic-v74.js'",1)
          sw.write_text(w)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m "v115: ativar transito oficial e rotas por via"
          git push