name: Direct assistant hotfix
on:
  push:
    paths:
      - '.github/workflows/direct-assistant-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply v50 patch
        run: python scripts/patch_icon_swap_v50.py
      - name: Commit v50
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajusta posições e direção dos ícones v50" || exit 0
          git push
