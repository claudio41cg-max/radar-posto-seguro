name: Direct assistant hotfix
on:
  push:
    paths:
      - '.github/workflows/direct-assistant-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply nearest and roads consolidation v67
        run: python scripts/patch_consolidate_nearest_roads_v67.py
      - name: Commit nearest and roads consolidation v67
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Consolida busca mais próxima e neutraliza vias v67" || exit 0
          git push
