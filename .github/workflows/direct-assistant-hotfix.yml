name: Direct assistant hotfix
on:
  push:
    paths:
      - '.github/workflows/direct-assistant-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply proximity and traffic fix v62
        run: python scripts/patch_proximity_and_traffic_v62.py
      - name: Commit proximity and traffic fix v62
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige comando mais próximo e remove malha verde amarela v62" || exit 0
          git push
