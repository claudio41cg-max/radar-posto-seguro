name: Direct assistant hotfix
on:
  push:
    paths:
      - '.github/workflows/direct-assistant-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply proximity bypass v63
        run: python scripts/patch_proximity_bypass_v63.py
      - name: Commit proximity bypass v63
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Faz comandos mais perto usarem o fluxo normal v63" || exit 0
          git push
