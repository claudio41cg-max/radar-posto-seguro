name: Direct assistant hotfix
on:
  push:
    paths:
      - '.github/workflows/direct-assistant-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply neighborhood GPS fix v68
        run: python scripts/patch_neighborhood_v68.py
      - name: Commit neighborhood GPS fix v68
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tomtom-proxy-client.js
          git commit -m "Corrige bairro usando GPS e CEP v68" || exit 0
          git push
