name: Direct assistant hotfix
on:
  push:
    paths:
      - '.github/workflows/direct-assistant-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply Geoapify client v69
        run: python scripts/patch_geoapify_client_v69.py
      - name: Commit Geoapify client v69
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tomtom-proxy-client.js
          git commit -m "Usa Geoapify para identificar bairro v69" || exit 0
          git push
