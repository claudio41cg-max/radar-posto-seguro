name: Protect TomTom frontend key

on:
  push:
    paths:
      - '.github/workflows/protect-tomtom-frontend.yml'

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove client key and route TomTom through Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1) A chave deixa de existir no código público. O valor real fica
          # somente no Secret TOMTOM_API_KEY do Cloudflare Worker.
          text, key_count = re.subn(
              r"const TOMTOM_KEY\s*=\s*'[^']*';",
              "const TOMTOM_KEY = '';",
              text,
              count=1,
          )
          if key_count != 1:
              raise SystemExit('Não foi possível localizar TOMTOM_KEY com segurança.')

          # 2) Instala o interceptador antes da inicialização do aplicativo.
          script_tag = '<script src="./tomtom-proxy-client.js?v=26"></script>'
          if script_tag not in text:
              marker = '<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css">'
              if marker not in text:
                  raise SystemExit('Marcador do cabeçalho não encontrado.')
              text = text.replace(marker, script_tag + '\n\n' + marker, 1)

          # 3) Tiles de trânsito do MapLibre não dependem de window.fetch;
          # por isso usam diretamente o proxy protegido do Worker.
          old_tile = "'https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?tileSize=256&key='+\n            TOMTOM_KEY"
          new_tile = "'https://radar-seguro-ia-rj.claudio41cg.workers.dev/v1/tomtom?path=/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png%3FtileSize%3D256'"
          if old_tile in text:
              text = text.replace(old_tile, new_tile, 1)
          elif new_tile not in text:
              raise SystemExit('URL da camada de trânsito TomTom não encontrada.')

          if text == original:
              raise SystemExit('Nenhuma alteração foi necessária.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          if not re.search(r"const TOMTOM_KEY\s*=\s*'';", text):
              raise SystemExit('TOMTOM_KEY ainda não foi esvaziada.')
          if './tomtom-proxy-client.js?v=26' not in text:
              raise SystemExit('Cliente protegido não foi carregado.')
          if 'radar-seguro-ia-rj.claudio41cg.workers.dev/v1/tomtom?path=/traffic/' not in text:
              raise SystemExit('Tiles de trânsito ainda não usam o proxy.')
          print('Proteção TomTom validada sem exibir segredos.')
          PY

      - name: Commit protected frontend
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sem alterações para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Protege chave TomTom no frontend'
          git push
