name: Restaurar poligonos antes da auditoria

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-reverter-poligonos-incorretos.yml'

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Reverter somente a alteracao geográfica incorreta
        shell: bash
        run: |
          git config user.name "Radar Seguro Bot"
          git config user.email "actions@users.noreply.github.com"
          git revert --no-edit 90ce89e251615ff81b4454c9dd7f39b7d8b0e33b
          git push
