name: v102 sync offline shell

on:
  push:
    paths:
      - '.github/workflows/service-worker-v102.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar shell offline com os modulos atuais
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')

          w=re.sub(r"const CACHE_NAME = 'radar-seguro-rj-v\d+';","const CACHE_NAME = 'radar-seguro-rj-v102';",w,1)
          w=re.sub(r"build:'\d+'","build:'102'",w)

          start=w.index('const APP_SHELL = [')
          end=w.index('];',start)+2
          shell="""const APP_SHELL = [
  './index.html',
  './manifest.json',
  './app-shell-v97.css?v=97',
  './voice-ui-v98.css?v=98',
  './legacy-inline-v99.css?v=99',
  './icon-192-1.png',
  './icon-512-1.png',
  './community-index-preload.js?v=86',
  './community-geometries-preload.js?v=89',
  './tomtom-proxy-client.js?v=69',
  './app-config-v100.js?v=100',
  './map-utils-v101.js?v=101',
  './route-traffic-v74.js',
  './traffic-clean-v75.js',
  './community-data-loader.js',
  './community-runtime-v83.js',
  './community-panel-v93.js',
  './community-map-style-v95.js',
  './data/community-datasets.json',
  './data/community-index.json',
  './data/community-geometries.json'
];"""
          w=w[:start]+shell+w[end:]
          sw.write_text(w,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<meta name="radar-build" content="[^"]+">','<meta name="radar-build" content="102-sync-offline-shell">',s,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v102
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "v102: sincronizar cache offline com modulos atuais" || exit 0
          git push
