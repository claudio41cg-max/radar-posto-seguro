name: v148 Santa Cruz polígonos oficiais
on:
  push:
    paths:
      - '.github/workflows/v147-santa-cruz-sabren.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar polígonos oficiais reais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,unicodedata,urllib.parse,urllib.request
          BASE='https://pgeo3.rio.rj.gov.br/arcgis/rest/services/SABREN'
          BOX=(-43.75,-23.05,-43.55,-22.85)
          def fetch(layer):
              q=urllib.parse.urlencode({'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','f':'geojson'})
              req=urllib.request.Request(BASE+'/'+layer+'/query?'+q,headers={'User-Agent':'Radar-Seguro-RJ/148-final'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode('utf-8'))
          def norm(v):return re.sub(r'[^a-z0-9]+',' ',unicodedata.normalize('NFKD',str(v or '')).encode('ascii','ignore').decode().lower()).strip()
          def pts(g):
              out=[]
              def walk(x):
                  if isinstance(x,list) and len(x)>=2 and all(isinstance(v,(int,float)) for v in x[:2]):out.append(x[:2])
                  elif isinstance(x,list):
                      for y in x:walk(y)
              walk((g or {}).get('coordinates',[]));return out
          def centroid(g):
              p=pts(g);return (sum(x for x,y in p)/len(p),sum(y for x,y in p)/len(p))
          def inside(g):
              x,y=centroid(g);return BOX[0]<=x<=BOX[2] and BOX[1]<=y<=BOX[3]
          def aggregate(fs):
              polys=[]
              for f in fs:
                  g=f['geometry']
                  if g['type']=='Polygon':polys.append(g['coordinates'])
                  elif g['type']=='MultiPolygon':polys.extend(g['coordinates'])
              return {'type':'MultiPolygon','coordinates':polys}
          f22=fetch('Limites_de_Favelas/FeatureServer/13')
          con=fetch('Conjuntos_Habitacionais/FeatureServer/0')
          def f22sel(fn):
              return [f for f in f22.get('features',[]) if f.get('geometry') and inside(f['geometry']) and fn(norm((f.get('properties') or {}).get('nome')))]
          def consel(fn):
              out=[]
              for f in con.get('features',[]):
                  if not f.get('geometry') or not inside(f['geometry']):continue
                  p=f.get('properties') or {};text=' | '.join(str(v) for v in p.values() if isinstance(v,str))
                  if fn(norm(text)):out.append(f)
              return out

          rollas=f22sel(lambda n:n=='rollas')
          coqueiral=f22sel(lambda n:n in ('jardim coqueiral','beco do coqueiral'))
          joao=f22sel(lambda n:'joao xxiii' in n or 'joao 23' in n)
          urucania=consel(lambda n:'maestro olimpio dos santos' in n and 'urucania' in n)
          aco_fav=f22sel(lambda n:n=='sao gomario')
          aco_con=consel(lambda n:'conjunto vila paciencia' in n and 'sao gomario' in n)
          aco=aco_fav+aco_con

          groups={
              'Rollas / Rodo (Santa Cruz)':rollas,
              'Coqueiral (Santa Cruz)':coqueiral,
              'Urucânia (Santa Cruz)':urucania,
              'Comunidade do Aço (Santa Cruz)':aco,
              'João XXIII (Santa Cruz)':joao,
          }
          for name,fs in groups.items():
              if not fs:raise SystemExit('Sem geometria oficial segura para '+name)
              g=aggregate(fs);x,y=centroid(g)
              if not (BOX[0]<=x<=BOX[2] and BOX[1]<=y<=BOX[3]):raise SystemExit('Geometria fora de Santa Cruz: '+name)
              print(name, len(fs), round(x,6), round(y,6))

          gp=Path('data/community-geometries.json');data=json.loads(gp.read_text(encoding='utf-8'));geoms=data.setdefault('geometries',{})
          for old in ['Rodo (Santa Cruz)','Comunidade do Rola (Santa Cruz)','Coqueiral (Santa Cruz)','Urucânia (Santa Cruz)','Comunidade do Aço (Santa Cruz)','João XXIII (Santa Cruz)']:
              geoms.pop(old,None)
          for name,fs in groups.items():geoms[name]=aggregate(fs)
          data['version']=148
          data['description']='v148: Santa Cruz usa polígonos municipais reais. Rollas/Rodo usa o limite oficial Rollas; Coqueiral usa Jardim+Beco do Coqueiral; Urucânia usa o Conjunto Maestro Olímpio dos Santos (Urucânia); Aço usa São Gomário + Conjunto Vila Paciência, compatíveis com a identificação municipal da comunidade; João XXIII usa o limite SABREN correspondente.'
          gp.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          ip=Path('data/community-index.json');idx=json.loads(ip.read_text(encoding='utf-8'))
          remove={'Rodo (Santa Cruz)','Comunidade do Rola (Santa Cruz)','Coqueiral (Santa Cruz)','Urucânia (Santa Cruz)','Comunidade do Aço (Santa Cruz)','João XXIII (Santa Cruz)'}
          areas=[a for a in idx.get('areas',[]) if a.get('name') not in remove];by={a.get('name'):a for a in areas}
          for name,fs in groups.items():
              g=aggregate(fs);x,y=centroid(g);a={'name':name,'c':[round(x,6),round(y,6)],'r':0.30};areas.append(a);by[name]=a
          idx['areas']=areas;idx['version']=148;idx['description']='Centros calculados a partir dos polígonos municipais reais; r é apenas índice de proximidade e não delimitação.'
          ip.write_text(json.dumps(idx,ensure_ascii=False,indent=2),encoding='utf-8')

          audit=[]
          for name,fs in groups.items():
              for f in fs:
                  p=f.get('properties') or {}
                  audit.append({'type':'Feature','properties':{'app_name':name,'nome_fonte':p.get('nome') or p.get('conjunto'),'fonte':'Prefeitura do Rio / SABREN-IPP'},'geometry':f['geometry']})
          Path('data/sabren-santa-cruz-v148.geojson').write_text(json.dumps({'type':'FeatureCollection','features':audit},ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          Path('community-geometries-preload.js').write_text("/* Radar Seguro RJ PRO v148 — Santa Cruz polígonos oficiais */\n(function(){window.RADAR_COMMUNITY_GEOMETRIES="+json.dumps(geoms,ensure_ascii=False,separators=(',',':'))+";window.RadarCommunityGeometriesPreload={version:'148-santa-cruz-poligonos-oficiais',count:Object.keys(window.RADAR_COMMUNITY_GEOMETRIES).length};})();\n",encoding='utf-8')
          lines=['/* Radar Seguro RJ PRO v148 — índice Santa Cruz polígonos oficiais */','const rawAreas = [']
          for a in areas:lines.append('  '+json.dumps(a,ensure_ascii=False,separators=(',',':'))+',')
          lines += ['];',"window.RadarCommunityIndexPreload={version:'148-santa-cruz-poligonos-oficiais',count:rawAreas.length};",'']
          Path('community-index-preload.js').write_text('\n'.join(lines),encoding='utf-8')

          sp=Path('community-map-style-v95.js');s=sp.read_text(encoding='utf-8')
          old="const OUT='community-cartographic-outline-v95',FILL='community-cartographic-fill-v95';"
          new="const OUT='community-cartographic-outline-v95',FILL='community-cartographic-fill-v95',SCF='santa-cruz-blue-fill-v148',SCO='santa-cruz-blue-outline-v148';\nconst SCN=['Rollas / Rodo (Santa Cruz)','Coqueiral (Santa Cruz)','Urucânia (Santa Cruz)','Comunidade do Aço (Santa Cruz)','João XXIII (Santa Cruz)'];"
          if old not in s:raise SystemExit('Cabeçalho de estilo não encontrado')
          s=s.replace(old,new,1)
          marker="if(!map.getLayer(OUT))map.addLayer({id:OUT,type:'line',source:'communities',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#f7fbfd','line-width':['interpolate',['linear'],['zoom'],9,1.05,12,1.45,15,1.8,18,2.1],'line-opacity':.96,'line-blur':.12}});"
          blue=marker+"\n  if(!map.getLayer(SCF))map.addLayer({id:SCF,type:'fill',source:'communities',filter:['match',['get','name'],SCN,true,false],paint:{'fill-color':'#3388ff','fill-opacity':.32}},map.getLayer('community-outline')?'community-outline':undefined);\n  if(!map.getLayer(SCO))map.addLayer({id:SCO,type:'line',source:'communities',filter:['match',['get','name'],SCN,true,false],layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#4da3ff','line-width':2.3,'line-opacity':.98}});"
          if marker not in s:raise SystemExit('Marcador de estilo não encontrado')
          s=s.replace(marker,blue,1);sp.write_text(s,encoding='utf-8')

          hp=Path('index.html');h=hp.read_text(encoding='utf-8')
          h=re.sub(r'<meta name="radar-build" content="[^"]+">','<meta name="radar-build" content="148-santa-cruz-poligonos-oficiais">',h,count=1)
          h=re.sub(r'community-index-preload\.js\?v=\d+','community-index-preload.js?v=148',h,count=1)
          h=re.sub(r'community-geometries-preload\.js\?v=\d+','community-geometries-preload.js?v=148',h,count=1)
          h=re.sub(r'community-map-style-v95\.js(?:\?v=\d+)?','community-map-style-v95.js?v=148',h,count=1)
          hp.write_text(h,encoding='utf-8')
          sw=Path('service-worker.js');w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const CACHE_NAME = 'radar-seguro-rj-v\d+';","const CACHE_NAME = 'radar-seguro-rj-v148';",w,count=1);w=re.sub(r"build:'\d+'","build:'148'",w,count=1)
          w=re.sub(r'community-index-preload\.js\?v=\d+','community-index-preload.js?v=148',w);w=re.sub(r'community-geometries-preload\.js\?v=\d+','community-geometries-preload.js?v=148',w);w=w.replace('./community-map-style-v95.js','./community-map-style-v95.js?v=148');sw.write_text(w,encoding='utf-8')
          PY
      - name: Validar mapa GPS e geometria
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text();sw=Path('service-worker.js').read_text();st=Path('community-map-style-v95.js').read_text();g=json.loads(Path('data/community-geometries.json').read_text())
          names=['Rollas / Rodo (Santa Cruz)','Coqueiral (Santa Cruz)','Urucânia (Santa Cruz)','Comunidade do Aço (Santa Cruz)','João XXIII (Santa Cruz)']
          for n in names:
              assert n in g['geometries'],n
              assert g['geometries'][n]['type']=='MultiPolygon',n
          assert 'Rodo (Santa Cruz)' not in g['geometries']
          for x in ['startGPS(){','updateCamera(){','new maplibregl.Map({','v146 — COMANDOS NATURAIS DO DIA A DIA']:assert x in s,x
          assert 'santa-cruz-blue-fill-v148' in st and '#3388ff' in st
          assert '148-santa-cruz-poligonos-oficiais' in s and 'radar-seguro-rj-v148' in sw
          assert Path('data/sabren-santa-cruz-v148.geojson').exists()
          print('v148 validada: polígonos reais, azul translúcido, mapa/GPS/câmera preservados')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community-geometries.json data/community-index.json data/sabren-santa-cruz-v148.geojson community-geometries-preload.js community-index-preload.js community-map-style-v95.js index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "v148: aplicar polígonos reais de Santa Cruz em azul translúcido"
          git push
