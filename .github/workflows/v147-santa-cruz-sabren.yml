name: v147 Santa Cruz SABREN
on:
  push:
    paths:
      - '.github/workflows/v147-santa-cruz-sabren.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar e aplicar limites oficiais SABREN
        run: python3 .github/scripts/v147_santa_cruz_sabren.py
      - name: Validar mapa e dados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text(); sw=Path('service-worker.js').read_text(); g=json.loads(Path('data/community-geometries.json').read_text())
          for x in ['Cesarão (Santa Cruz)','Comunidade do Rola (Santa Cruz)','Comunidade de Antares (Santa Cruz)','Comunidade do Aço (Santa Cruz)']:
              assert x in g['geometries'] and g['geometries'][x]['type']=='MultiPolygon', x
          for x in ['startGPS(){','updateCamera(){','new maplibregl.Map({','v146 — COMANDOS NATURAIS DO DIA A DIA']:
              assert x in s, x
          assert '147-santa-cruz-sabren' in s and 'radar-seguro-rj-v147' in sw
          assert Path('data/sabren-santa-cruz-v147.geojson').exists()
          print('v147 validada: SABREN aplicado onde confirmado; demais contornos preservados; mapa/GPS/voz/câmera intactos')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community-geometries.json data/community-index.json data/sabren-santa-cruz-v147.geojson community-geometries-preload.js community-index-preload.js index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "v147: aplicar limites SABREN nas comunidades de Santa Cruz"
          git push
