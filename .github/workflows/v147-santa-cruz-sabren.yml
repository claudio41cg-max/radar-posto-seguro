name: v148 Santa Cruz real
on:
  push:
    paths:
      - '.github/workflows/v147-santa-cruz-sabren.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnosticar SABREN 2022 em Santa Cruz
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          url='https://pgeo3.rio.rj.gov.br/arcgis/rest/services/SABREN/Limites_de_Favelas/FeatureServer/13/query'
          q=urllib.parse.urlencode({'where':'1=1','outFields':'nome,bairro,ra,complexo,cod_favela','returnGeometry':'true','outSR':'4326','f':'geojson'})
          req=urllib.request.Request(url+'?'+q,headers={'User-Agent':'Radar-Seguro-RJ/148-diag'})
          with urllib.request.urlopen(req,timeout=60) as r:d=json.loads(r.read().decode())
          def pts(g):
            out=[]
            def walk(x):
              if isinstance(x,list) and len(x)>=2 and all(isinstance(v,(int,float)) for v in x[:2]):out.append(x[:2])
              elif isinstance(x,list):
                for y in x:walk(y)
            walk((g or {}).get('coordinates',[]));return out
          rows=[]
          for f in d.get('features',[]):
            p=f.get('properties') or {};g=f.get('geometry');a=pts(g)
            if not a:continue
            x=sum(v[0] for v in a)/len(a);y=sum(v[1] for v in a)/len(a)
            if -43.75<=x<=-43.55 and -23.05<=y<=-22.85:
              rows.append((str(p.get('nome')),str(p.get('bairro')),str(p.get('ra')),str(p.get('complexo')),p.get('cod_favela'),round(x,6),round(y,6)))
          for row in sorted(rows):print('SABREN2022',row)
          print('TOTAL',len(rows))
          PY
