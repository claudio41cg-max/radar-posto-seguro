name: v148 diagnostico Aco por aliases
on:
  push:
    paths:
      - '.github/workflows/v147-santa-cruz-sabren.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar Aço em camadas municipais
        run: |
          python3 - <<'PY'
          import json,re,unicodedata,urllib.parse,urllib.request
          B=(-43.70,-22.96,-43.61,-22.89)
          BASE='https://pgeo3.rio.rj.gov.br/arcgis/rest/services/SABREN'
          def get(url):
            q=urllib.parse.urlencode({'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','f':'geojson'})
            req=urllib.request.Request(url+'?'+q,headers={'User-Agent':'Radar-Seguro-RJ/148-diag3'})
            with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          def norm(v):return re.sub(r'[^a-z0-9]+',' ',unicodedata.normalize('NFKD',str(v or '')).encode('ascii','ignore').decode().lower()).strip()
          def pts(g):
            o=[]
            def w(x):
              if isinstance(x,list) and len(x)>=2 and all(isinstance(v,(int,float)) for v in x[:2]):o.append(x[:2])
              elif isinstance(x,list):
                for y in x:w(y)
            w((g or {}).get('coordinates',[]));return o
          def cent(g):
            p=pts(g);return (sum(x for x,y in p)/len(p),sum(y for x,y in p)/len(p)) if p else (None,None)
          aliases=['aco','vila paciencia','sao gomario','massape','dialta','vagoes','vagao','santa efigenia','estrada da pedra']
          layers=[
            ('Favelas2019',BASE+'/DadosGeraisFavelas/FeatureServer/0/query'),
            ('Favelas2022',BASE+'/Limites_de_Favelas/FeatureServer/13/query'),
            ('Loteamentos',BASE+'/Loteamentos/FeatureServer/0/query'),
            ('Conjuntos',BASE+'/Conjuntos_Habitacionais/FeatureServer/0/query')]
          for label,url in layers:
            d=get(url);print('\nSOURCE',label)
            for f in d.get('features',[]):
              g=f.get('geometry');p=f.get('properties') or {};x,y=cent(g)
              if x is None or not(B[0]<=x<=B[2] and B[1]<=y<=B[3]):continue
              text=' | '.join(str(v) for v in p.values() if isinstance(v,str) and v.strip());n=norm(text)
              if any(a in n for a in aliases):print('CANDIDATE',round(x,6),round(y,6),text[:1200])
          PY
