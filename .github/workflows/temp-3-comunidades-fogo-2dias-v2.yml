name: Ajuste temporario de comunidades e ocorrencias

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-3-comunidades-fogo-2dias-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar limites oficiais e regra de dois dias
        run: node .github/scripts/temp-add3.js

      - name: Publicar somente se os testes passarem
        shell: bash
        run: |
          git config user.name "Radar Seguro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/sabren-cdd-mare-rocinha.geojson
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Adicionar 3 polígonos e limitar ocorrências a 2 dias"
          git push
