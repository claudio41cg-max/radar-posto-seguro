name: v138 externalize search

on:
  push:
    paths:
      - '.github/workflows/v138-externalize-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tirar busca e geocodificacao do index
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start_marker = "/* =========================================================\n   BUSCA\n========================================================= */"
          end_marker = "/* =========================================================\n   TOMTOM\n========================================================= */"

          start = s.find(start_marker)
          end = s.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Marcadores BUSCA/TOMTOM nao encontrados na ordem esperada')

          body_start = start + len(start_marker)
          body = s[body_start:end]
          if 'normalizeSearch(q)' not in body or 'renderSuggestions(results)' not in body:
              raise SystemExit('Bloco de busca inesperado; abortando para nao quebrar o app')

          module = """/* Radar Seguro RJ PRO v138 — busca/geocodificacao extraidas do index.html */\nwindow.RadarSearchV138 = {""" + body + "\n};\n"
          Path('search-module-v138.js').write_text(module, encoding='utf-8')

          replacement = "/* =========================================================\n   BUSCA — externalizada em search-module-v138.js\n========================================================= */\n\n"
          s = s[:start] + replacement + s[end:]

          traffic_anchor = 'const TrafficAssistantV40='
          pos = s.find(traffic_anchor)
          if pos < 0:
              raise SystemExit('Ponto seguro apos o fechamento do App nao encontrado')

          assign = "Object.assign(App, window.RadarSearchV138 || {});\n\n"
          if assign not in s:
              s = s[:pos] + assign + s[pos:]

          # Carrega o modulo antes do bloco que declara App. Usa como ancora o modulo de postos v137.
          fuel_tag = '<script src="./fuel-module-v137.js?v=137"></script>'
          if fuel_tag in s and 'search-module-v138.js?v=138' not in s:
              s = s.replace(fuel_tag, fuel_tag + '\n<script src="./search-module-v138.js?v=138"></script>', 1)
          elif 'search-module-v138.js?v=138' not in s:
              # Fallback seguro: insere logo antes do script que inicia o APP, sem depender de numero de linha.
              app_marker = '/* =========================================================\n   APP\n========================================================= */'
              app_pos = s.find(app_marker)
              if app_pos < 0:
                  raise SystemExit('Ancora APP nao encontrada para carregar modulo de busca')
              script_open = s.rfind('<script>', 0, app_pos)
              if script_open < 0:
                  raise SystemExit('Script do APP nao encontrado')
              s = s[:script_open] + '<script src="./search-module-v138.js?v=138"></script>\n' + s[script_open:]

          p.write_text(s, encoding='utf-8')

      - name: Validar alteracao
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          m = Path('search-module-v138.js').read_text(encoding='utf-8')
          assert 'search-module-v138.js?v=138' in s
          assert 'Object.assign(App, window.RadarSearchV138 || {});' in s
          assert 'normalizeSearch(q)' not in s
          assert 'geocodeTomTom(q,signal)' not in s
          assert 'renderSuggestions(results)' not in s
          assert 'normalizeSearch(q)' in m
          assert 'geocodeTomTom(q,signal)' in m
          assert 'renderSuggestions(results)' in m
          assert 'const App = {' in s
          print('v138 validada')

      - name: Commit v138
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html search-module-v138.js
          git diff --cached --quiet && exit 0
          git commit -m "v138: extrair busca e geocodificacao do index"
          git push
