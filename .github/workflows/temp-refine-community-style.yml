name: Refinar visual dos polígonos

on:
  push:
    paths:
      - .github/workflows/temp-refine-community-style.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar script
        run: node --check .github/scripts/temp-refine-community-style.js

      - name: Aplicar refinamento visual
        run: node .github/scripts/temp-refine-community-style.js

      - name: Confirmar escopo e publicar
        run: |
          test -n "$(git status --short index.html)"
          test -z "$(git status --short -- data/fogo-cruzado.json)"
          git config user.name "Radar Seguro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refina polígonos e nomes das comunidades"
          git pull --rebase origin main
          git push origin HEAD:main
