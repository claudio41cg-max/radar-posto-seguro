name: Refinar alvos e preenchimento das comunidades

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-refinar-alvos-poligonos.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar e validar correções visuais
        run: node .github/scripts/temp-refine-marker-polygons.js

      - name: Publicar somente se todos os testes passarem
        shell: bash
        run: |
          git config user.name "Radar Seguro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refinar alvos e restaurar preenchimento das comunidades"
          git push
